name: '[Release] Production promotion gate (fail-closed; never publishes)'

# CI checks independently approved evidence and signed inputs. No ReleaseRoot
# private key belongs here. Publication remains an offline human action.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full lowercase 40-hex SHA of the candidate on main
        required: true
      ledger_commit:
        description: Full lowercase 40-hex SHA of the separately reviewed ledger commit on main
        required: true
      bundle_run_id:
        description: Actions run ID that contains the signed promotion bundle artifact
        required: false
        default: ""
      bundle_artifact:
        description: Artifact name containing the signed promotion bundle
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  promotion-verification:
    name: Exact-commit evidence and offline-signed bundle (no publication)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production-promotion
    steps:
      - name: Require a main dispatch and full commit IDs
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
          LEDGER_COMMIT: ${{ inputs.ledger_commit }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Dispatch this workflow from protected main.' >&2
            exit 1
          fi
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$LEDGER_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Candidate and ledger commits must be full lowercase 40-hex SHA-1s.' >&2
            exit 1
          fi

      - name: Checkout trusted tooling and history at the main dispatch SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: trusted-main
          persist-credentials: false

      - name: Validate the trusted tooling checkout
        shell: bash
        run: test "$(git -C trusted-main rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify gate tooling and the reviewed ledger for the exact candidate
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
          LEDGER_COMMIT: ${{ inputs.ledger_commit }}
        run: |
          set -euo pipefail
          python -m unittest discover -s trusted-main/tools/gates -p 'test_*.py' -v
          python trusted-main/tools/release/production_promotion.py \
            --check-ledger --commit "$COMMIT" --ledger-commit "$LEDGER_COMMIT" \
            > gate-verification.txt 2>&1

      - name: Checkout the approved candidate separately (never execute its tooling)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          path: candidate
          persist-credentials: false

      - name: Verify the candidate checkout is exact
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
        run: test "$(git -C candidate rev-parse HEAD)" = "$COMMIT"

      - name: Require signed bundle inputs and provision the independently pinned verifier
        shell: bash
        env:
          BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
          BUNDLE_ARTIFACT: ${{ inputs.bundle_artifact }}
          ROOT_SHA256: ${{ vars.BOREAS_RELEASE_ROOT_SHA256 }}
          VERIFIER_URL: ${{ vars.BOREAS_PROMOTION_VERIFIER_URL }}
          VERIFIER_SHA256: ${{ vars.BOREAS_PROMOTION_VERIFIER_SHA256 }}
        run: |
          set -euo pipefail
          if ! [[ "$BUNDLE_RUN_ID" =~ ^[1-9][0-9]*$ && -n "$BUNDLE_ARTIFACT" ]]; then
            echo 'An exact Actions run ID and bundle artifact name are required.' >&2
            exit 1
          fi
          if ! [[ "$ROOT_SHA256" =~ ^[0-9a-f]{64}$ && "$VERIFIER_SHA256" =~ ^[0-9a-f]{64}$ && "$VERIFIER_URL" == https://* ]]; then
            echo 'Configure the independently pinned ReleaseRoot and verifier digests and HTTPS verifier URL.' >&2
            exit 1
          fi
          verifier_dir=$(mktemp -d "${RUNNER_TEMP}/boreas-verifier.XXXXXXXX")
          verifier_path="$verifier_dir/verify"
          curl --disable --fail --silent --show-error --location --max-redirs 3 \
            --proto '=https' --proto-redir '=https' --globoff --max-time 120 \
            --max-filesize 67108864 --output "$verifier_path" -- "$VERIFIER_URL"
          printf '%s  %s\n' "$VERIFIER_SHA256" "$verifier_path" | sha256sum --check --status
          chmod 500 "$verifier_path"
          printf 'BOREAS_VERIFIER_EXECUTABLE=%s\n' "$verifier_path" >> "$GITHUB_ENV"

      - name: Download signed promotion bundle from the selected run
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.bundle_artifact }}
          run-id: ${{ inputs.bundle_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/boreas-promotion-bundle

      - name: Verify the signed bundle with trusted tooling and the independent verifier
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
          LEDGER_COMMIT: ${{ inputs.ledger_commit }}
          ROOT_SHA256: ${{ vars.BOREAS_RELEASE_ROOT_SHA256 }}
        run: |
          set -euo pipefail
          python trusted-main/tools/release/production_promotion.py \
            --commit "$COMMIT" \
            --ledger-commit "$LEDGER_COMMIT" \
            --bundle-dir "$RUNNER_TEMP/boreas-promotion-bundle" \
            --expected-release-root-sha256 "$ROOT_SHA256" \
            --verifier-executable "$BOREAS_VERIFIER_EXECUTABLE" \
            --report production-promotion-report.json

      - name: Upload gate verification record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-gate-ledger-${{ github.run_id }}
          path: gate-verification.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload promotion verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-promotion-report-${{ github.run_id }}
          path: production-promotion-report.json
          if-no-files-found: warn
          retention-days: 30
