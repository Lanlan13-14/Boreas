name: 'On demand / OpenSSL CLI experiment (not the Boreas tunnel)'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openssl-ml-dsa-tls:
    name: Verify CLI handshakes with the pinned OpenSSL source
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OPENSSL_COMMIT: a7e57082ccb27330a42f5f116a4e125b13bdcfef
      OPENSSL_SHA256: 21a34f1e90d7accefefb9ad23b0e15a83a7d5504ffb53142f9193ecb44364340
      OPENSSL_VERSION_TRIPLE: 4.1.1
      OPENSSL_PRERELEASE: dev
      OPENSSL_VERSION: 4.1.1-dev
      OPENSSL_PREFIX: ${{ github.workspace }}/.poc-openssl
      ARTIFACT_DIR: ${{ github.workspace }}/crypto-poc-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential perl wget ca-certificates iproute2 binutils
      - name: Download and verify pinned OpenSSL commit
        shell: bash
        run: |
          set -euo pipefail
          bash tools/dependencies/fetch-openssl.sh openssl-src
      - name: Build OpenSSL static library and CLI
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cd openssl-src
          # Candidate surface reduction only; the independent CVE gate stays blocking.
          ./Configure linux-x86_64 no-quic no-cms no-siv no-shared no-tests --prefix="${OPENSSL_PREFIX}" --openssldir="${OPENSSL_PREFIX}/ssl"
          make -j2
          make install_sw
          test -x "${OPENSSL_PREFIX}/bin/openssl"
          readelf -d "${OPENSSL_PREFIX}/bin/openssl" | tee "${GITHUB_WORKSPACE}/crypto-poc-linkage.txt"
          if grep -Eq 'Shared library: \[lib(ssl|crypto)\.so' "${GITHUB_WORKSPACE}/crypto-poc-linkage.txt"; then
            echo 'OpenSSL CLI unexpectedly linked against shared libssl/libcrypto' >&2
            exit 1
          fi
          echo 'NOTE: static OpenSSL libraries verified; this is a backend PoC, not a fully static libc executable.' | tee -a "${GITHUB_WORKSPACE}/crypto-poc-linkage.txt"
      - name: Run hybrid ML-DSA mTLS and fail-closed cases
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/crypto-poc/run-openssl-mtls.sh
          tools/crypto-poc/run-openssl-mtls.sh
      - name: Verify exact reduced OpenSSL build (not a CVE waiver)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OPENSSL_PREFIX}/ssl"
          cp "${ARTIFACT_DIR}/openssl-test-config.cnf" "${OPENSSL_PREFIX}/ssl/openssl.cnf"
          bash tools/dependencies/verify-openssl-build.sh \
            openssl-src "${OPENSSL_PREFIX}" \
            "${ARTIFACT_DIR}/openssl-runtime.txt" \
            "${ARTIFACT_DIR}/openssl-build.txt"
      - name: Upstream regressions for the reviewed security snapshot
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          # Deliberately separate full-feature TEST build: the production
          # no-quic/no-cms/no-siv/no-tests configuration remains unchanged.
          # Run only upstream recipes relevant to X509/DANE/QUIC/PEM/CMS,
          # and retain the full TAP output including any explicit skips.
          mkdir -p upstream-security-evidence
          git rev-parse HEAD > upstream-security-evidence/boreas-sha.txt
          printf '%s\n' "$OPENSSL_COMMIT" "$OPENSSL_SHA256" > upstream-security-evidence/openssl-pin.txt
          bash tools/dependencies/fetch-openssl.sh openssl-upstream-tests
          cd openssl-upstream-tests
          ./Configure linux-x86_64 no-shared enable-tests > ../upstream-security-evidence/configure.log 2>&1
          make -j2 > ../upstream-security-evidence/build.log 2>&1
          make test TESTS='test_dane test_verify test_verify_extra test_quic_stream test_quic_radix test_pem_reading test_pem_read_depr test_cms' HARNESS_VERBOSE=yes 2>&1 | tee ../upstream-security-evidence/regressions.log
          printf 'UPSTREAM_REGRESSIONS=PASSED\n' > ../upstream-security-evidence/result.txt
      - name: Preserve upstream regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openssl-upstream-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: upstream-security-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Fail if private TLS material escaped sanitizer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E -i 'Resumption PSK:|Early Exporter Master Secret|CLIENT_TRAFFIC_SECRET|SERVER_TRAFFIC_SECRET|-----BEGIN .*PRIVATE KEY-----' crypto-poc-artifacts/; then
            echo 'Refusing artifact upload: private TLS material detected' >&2
            exit 1
          fi
      - name: Upload test evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openssl-${{ env.OPENSSL_VERSION }}-crypto-poc-${{ github.run_id }}
          path: |
            crypto-poc-artifacts/*.txt
            crypto-poc-artifacts/*.cnf
            crypto-poc-artifacts/*.sanitized.txt
            crypto-poc-linkage.txt
            openssl.tar.gz
          if-no-files-found: warn
          retention-days: 30
