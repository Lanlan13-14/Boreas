name: Platform build and compatibility (development only)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64 musl (static)
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: boreas-foundation-dev-linux-x86_64-musl
            platform: linux
            expected_arch: x86_64
          - label: Linux aarch64 musl (static, native)
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: boreas-foundation-dev-linux-aarch64-musl
            platform: linux
            expected_arch: aarch64
          - label: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: boreas-foundation-dev-windows-x86_64
            platform: windows
            expected_arch: AMD64
          - label: macOS Intel x86_64 (native)
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: boreas-foundation-dev-macos-x86_64
            platform: macos
            expected_arch: x86_64
          - label: macOS Apple Silicon aarch64 (native)
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: boreas-foundation-dev-macos-aarch64
            platform: macos
            expected_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify native runner architecture (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          actual="$(uname -m)"
          test "$actual" = "${{ matrix.expected_arch }}" || {
            echo "Expected native ${{ matrix.expected_arch }} runner, got $actual" >&2
            exit 1
          }
      - name: Verify native runner architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne '${{ matrix.expected_arch }}') {
            throw "Expected native ${{ matrix.expected_arch }} runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Install musl toolchain (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools binutils musl-dev
      - name: Configure native musl linker
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            x86_64-unknown-linux-musl) echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV" ;;
            aarch64-unknown-linux-musl) echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV" ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run workspace tests on the target
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Build CLI foundation artifact
        run: cargo build --locked --release -p boreas-cli --target ${{ matrix.target }}
      - name: Verify Linux executable is static
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -eu
          binary="target/${{ matrix.target }}/release/boreas"
          file "$binary"
          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo 'Expected a static musl executable with no ELF interpreter' >&2
            exit 1
          fi
      - name: Upload development-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.run_id }}
          path: target/${{ matrix.target }}/release/boreas${{ matrix.platform == 'windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 14

  linux-container-compat:
    name: Static Linux doctor in ${{ matrix.label }}
    needs: build-test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu 24.04
            image: ubuntu:24.04
          - label: Debian Bookworm
            image: debian:bookworm-slim
          - label: Fedora 42
            image: fedora:42
          - label: Alpine 3.22
            image: alpine:3.22
    steps:
      - name: Download Linux x86_64 development artifact
        uses: actions/download-artifact@v4
        with:
          name: boreas-foundation-dev-linux-x86_64-musl-${{ github.run_id }}
          path: ./linux-binary
      - name: Run doctor in target distribution container
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./linux-binary/boreas
          docker run --rm --platform linux/amd64 \
            -v "$PWD/linux-binary/boreas:/boreas:ro" \
            "${{ matrix.image }}" /boreas doctor | tee doctor.json
          grep -F '"status":"foundation_only"' doctor.json
          grep -F '"phase0_complete":false' doctor.json
