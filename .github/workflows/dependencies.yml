name: '[Security] Dependency CVEs and freshness'

on:
  push:
  pull_request:
  schedule:
    - cron: '31 4 * * *'
  workflow_dispatch:
    inputs:
      fail_on_outdated:
        description: 'Fail on any outdated direct dependency (not a vulnerability test)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: never

jobs:
  audit:
    name: Locked RustSec CVE gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable snapshot
        with:
          toolchain: stable
      - name: Initialize evidence
        run: |
          mkdir -p dependency-reports
          git rev-parse HEAD > dependency-reports/source-sha.txt
          sha256sum Cargo.lock > dependency-reports/lock.sha256
          rustc --version > dependency-reports/rustc.txt
      - name: Check manifest-lock consistency without changing lock
        id: metadata
        continue-on-error: true
        run: cargo metadata --locked --all-features --format-version 1 --no-deps > dependency-reports/metadata.json 2> dependency-reports/metadata.stderr
      - name: Install version-pinned audit from crates.io with its published lock
        id: install
        if: always()
        run: cargo install cargo-audit --version '=0.23.0' --locked --registry crates-io > dependency-reports/install.log 2>&1
      - name: Fetch current RustSec data and audit exact committed lock
        id: scan
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/RustSec/advisory-db.git "$RUNNER_TEMP/boreas-advisory-db" > dependency-reports/database.log 2>&1
          git -C "$RUNNER_TEMP/boreas-advisory-db" rev-parse HEAD > dependency-reports/database-sha.txt
          date -u +%FT%TZ > dependency-reports/queried-at.txt
          cargo audit --version > dependency-reports/audit-version.txt
          # Isolate from repository .cargo/audit.toml (no implicit ignores/targets).
          mkdir -p "$RUNNER_TEMP/boreas-audit"
          cp Cargo.lock "$RUNNER_TEMP/boreas-audit/Cargo.lock"
          cd "$RUNNER_TEMP/boreas-audit"
          cargo audit --file Cargo.lock --db "$RUNNER_TEMP/boreas-advisory-db" --no-fetch --deny warnings --json > "$GITHUB_WORKSPACE/dependency-reports/audit.json" 2> "$GITHUB_WORKSPACE/dependency-reports/audit.stderr"
      - name: Enforce lock consistency and no source changes
        if: always()
        env:
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
        run: |
          git diff --exit-code -- Cargo.lock Cargo.toml 'crates/**/Cargo.toml'
          test "$METADATA_OUTCOME" = success
      - name: Preserve audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-reports/
          if-no-files-found: error
          retention-days: 30

  reports:
    name: Registry, GitHub advisories and native OpenSSL review gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Query official sources (no Cargo resolve, build or lock refresh)
        env:
          GH_TOKEN: ${{ github.token }}
          FAIL_ON_OUTDATED: ${{ inputs.fail_on_outdated && '1' || '0' }}
        run: python tools/dependencies/report.py
      - name: Preserve raw sources and reports even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-reports/
          if-no-files-found: error
          retention-days: 30
