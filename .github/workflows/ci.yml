name: 'Quick checks / Rust tests, lint and release tools'

on:
  push:
    branches: [main, 'work/v111-handoff', 'feat/pq-wg-transport']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/**'
      - 'tools/**'
      - 'docs/engineering/gates.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/**'
      - 'tools/**'
      - 'docs/engineering/gates.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lock:
    name: Locked dependency preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Cargo.lock satisfies every workspace manifest
        shell: bash
        run: |
          set -euo pipefail
          # --no-deps only prints workspace members and skips resolution, so
          # --locked never compared the lock against the graph; stale locks
          # passed. Resolve the full graph so --locked is actually enforced.
          if ! cargo metadata --locked --format-version 1 > /dev/null 2> lock-error.txt; then
            cat lock-error.txt
            echo "::error title=Stale Cargo.lock::Cargo.lock does not satisfy the workspace manifests. Dispatch the 'Refresh Cargo.lock' workflow on main, review its validated diff, then rerun CI."
            exit 1
          fi

  format:
    name: Apply stable rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Save format patch
        if: always()
        run: git diff --binary > format.patch
      - name: Upload format patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustfmt-patch
          path: format.patch
          if-no-files-found: warn

  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format workspace before checks
        if: always()
        run: cargo fmt --all
      - name: Clippy
        if: always()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: always()
        run: cargo test --workspace --locked
      - name: Set up Python (Linux only)
        if: always() && runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Verify independent vectors (Linux only)
        if: always() && runner.os == 'Linux'
        run: |
          python tools/verify_vectors.py
          python -m unittest discover -s tools/tests -v
      - name: Verify production gate tooling (Linux only)
        if: always() && runner.os == 'Linux'
        run: python -m unittest discover -s tools/gates -p 'test_*.py' -v
      - name: Verify release tooling and fail-closed promotion cases (Linux only)
        if: always() && runner.os == 'Linux'
        run: |
          python -m unittest discover -s tools/release -p 'test_*.py' -v
          python tools/release/production_promotion.py --self-test
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in sorted(Path('tools/release').glob('*.py')):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('release tool syntax OK')
          PY
