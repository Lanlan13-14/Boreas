name: Refresh Cargo.lock

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Generate and review Cargo.lock on demand
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Record source revision
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" | tee source-revision.txt
      - name: Generate lockfile explicitly
        run: cargo generate-lockfile
      - name: Verify lock resolves all workspace members
        run: cargo metadata --format-version 1 --locked --no-deps > workspace-metadata.json
      - name: Upload exact generated lock and source revision for CI
        uses: actions/upload-artifact@v4
        with:
          name: generated-cargo-lock-${{ github.run_id }}
          path: |
            Cargo.lock
            source-revision.txt
          if-no-files-found: error
          retention-days: 3
      - name: Commit generated lock on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- Cargo.lock
            git commit -m 'Refresh Cargo.lock from workspace manifests'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'Cargo.lock already matches the manifests; no commit required.'
          fi
