name: 'Integration / Encrypted tunnel, failover and throughput'

on:
  workflow_dispatch:
    inputs:
      single_circuit_diagnostics:
        description: 'Measure the first second of one and four application flows on one E2E circuit'
        type: boolean
        default: false
  push:
    branches: [main, 'work/v111-handoff', 'fix/v111-integration', 'fix/v111-release-blockers', 'test/v111-*', 'feat/pq-wg-transport']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/boreas-crypto/**'
      - 'crates/boreas-pki/**'
      - 'crates/boreas-proto/**'
      - 'crates/boreas-supervisor/**'
      - 'crates/boreas-tun/**'
      - 'crates/boreas-tunnel/**'
      - 'crates/boreas-cli/**'
      - 'crates/boreas-dns/**'
      - 'tools/deploy/**'
      - 'tools/release/netns_daemon_smoke.sh'
      - 'tools/release/netns_private_dns_fixture.py'
      - 'tools/release/netns_public_dns_fixture.py'
      - 'tools/release/netns_dns_replica.sh'
      - 'tools/release/netns_pool_cutover.sh'
      - 'tools/release/netns_overlay_perf.py'
      - 'tools/release/netns_multi_active_probe.py'
      - 'tools/dependencies/fetch-openssl.sh'
      - 'tools/dependencies/verify-openssl-build.sh'
      - 'tools/dependencies/openssl-review.json'
      - 'tools/dependencies/report.py'
      - '.github/workflows/rust-tls.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/boreas-crypto/**'
      - 'crates/boreas-pki/**'
      - 'crates/boreas-proto/**'
      - 'crates/boreas-supervisor/**'
      - 'crates/boreas-tun/**'
      - 'crates/boreas-tunnel/**'
      - 'crates/boreas-cli/**'
      - 'crates/boreas-dns/**'
      - 'tools/deploy/**'
      - 'tools/release/netns_daemon_smoke.sh'
      - 'tools/release/netns_private_dns_fixture.py'
      - 'tools/release/netns_public_dns_fixture.py'
      - 'tools/release/netns_dns_replica.sh'
      - 'tools/release/netns_pool_cutover.sh'
      - 'tools/release/netns_overlay_perf.py'
      - 'tools/release/netns_multi_active_probe.py'
      - 'tools/dependencies/fetch-openssl.sh'
      - 'tools/dependencies/verify-openssl-build.sh'
      - 'tools/dependencies/openssl-review.json'
      - 'tools/dependencies/report.py'
      - '.github/workflows/rust-tls.yml'

permissions:
  contents: read

concurrency:
  group: rust-tls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openssl-rust-mtls:
    name: Real Linux tunnel with the pinned OpenSSL security snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      binary_id: ${{ steps.acceptance_binary.outputs.artifact-id }}
      runtime_id: ${{ steps.acceptance_runtime.outputs.artifact-id }}
      mesh_id: ${{ steps.acceptance_mesh_binary.outputs.artifact-id }}
    env:
      # openssl-4.1 @ a7e57082ccb2: contains all twelve reviewed fixes
      # through the 2026-11-24 advisory. This is a 4.1.1-dev snapshot,
      # NOT the unreleased 4.1.1 release; archive identity is verified.
      OPENSSL_COMMIT: a7e57082ccb27330a42f5f116a4e125b13bdcfef
      OPENSSL_SHA256: 21a34f1e90d7accefefb9ad23b0e15a83a7d5504ffb53142f9193ecb44364340
      OPENSSL_VERSION_TRIPLE: 4.1.1
      OPENSSL_PRERELEASE: dev
      OPENSSL_VERSION: 4.1.1-dev
      OPENSSL_PREFIX: ${{ github.workspace }}/.rust-tls-openssl
      OPENSSL_CONF: ${{ github.workspace }}/.rust-tls-openssl/ssl/openssl.cnf
      OPENSSL_NO_VENDOR: '1'
      BOREAS_OPENSSL_BIN: ${{ github.workspace }}/.rust-tls-openssl/bin/openssl
      BOREAS_REQUIRE_TLS_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable snapshot
        with:
          components: rustfmt, clippy
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential perl curl ca-certificates pkg-config binutils \
            musl-tools linux-libc-dev file iproute2 iputils-ping
      - name: Show what this run validates
        run: |
          {
            echo '### What this checks'
            echo 'Real Linux tunnel: authentication, packet delivery, private DNS, failover, upgrade rollback and (on acceptance refs) throughput.'
            printf '\nOpenSSL source version: `%s` (reviewed source snapshot, not a published release).\n\n' "$OPENSSL_VERSION"
            printf 'Pinned source commit: `%s`\n' "$OPENSSL_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build pinned static OpenSSL
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          bash tools/dependencies/fetch-openssl.sh openssl-src
          cd openssl-src
          # The commit above carries the advisory fixes, but it is still a
          # development snapshot. These options remove the QUIC, CMS and SIV
          # surfaces; the build verifier checks the result. Pinning the fixed
          # commit is not a release and not a CVE waiver.
          ./Configure linux-x86_64 no-quic no-cms no-siv no-shared no-tests \
            --prefix="${OPENSSL_PREFIX}" --openssldir="${OPENSSL_PREFIX}/ssl"
          make -j"$(nproc)"
          make install_sw
          mkdir -p "${OPENSSL_PREFIX}/ssl"
          # install_sw does not install openssl.cnf.  Write an explicit minimal
          # config (built-in default provider only) without YAML indentation.
          printf '%s\n' \
            'openssl_conf = openssl_init' \
            '' \
            '[openssl_init]' \
            'providers = provider_sect' \
            '' \
            '[provider_sect]' \
            'default = default_sect' \
            '' \
            '[default_sect]' \
            'activate = 1' \
            > "${OPENSSL_PREFIX}/ssl/openssl.cnf"
          test -s "${OPENSSL_PREFIX}/ssl/openssl.cnf"
          cd "${GITHUB_WORKSPACE}"
          bash tools/dependencies/verify-openssl-build.sh \
            openssl-src "${OPENSSL_PREFIX}" \
            "${GITHUB_WORKSPACE}/openssl-runtime.txt" \
            "${GITHUB_WORKSPACE}/openssl-build.txt"
          readelf -d "${OPENSSL_PREFIX}/bin/openssl" \
            | tee "${GITHUB_WORKSPACE}/openssl-linkage.txt"
          if grep -Eq 'Shared library: \[lib(ssl|crypto)\.so' \
              "${GITHUB_WORKSPACE}/openssl-linkage.txt"; then
            echo 'OpenSSL CLI unexpectedly links shared libssl/libcrypto' >&2
            exit 1
          fi
      - name: Refuse accidental vendored OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --include='Cargo.toml' -n 'vendored' crates/boreas-crypto; then
            echo 'crates/boreas-crypto must not enable the vendored OpenSSL feature' >&2
            exit 1
          fi
      - name: Assert expected OpenSSL feature flags exist
        # `cargo test --all-features` silently succeeds when a feature does not
        # exist.  This preflight makes a missing pki/tunnel/supervisor feature a
        # hard failure instead of a false-green run of old tests.
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          expected = {
              "boreas-crypto": "openssl-backend",
              "boreas-pki": "openssl-backend",
              "boreas-tunnel": "openssl-inner-tls",
              "boreas-supervisor": "openssl-backend",
              "boreas-cli": "openssl-inner-tls",
          }
          packages = {package["name"]: package for package in metadata["packages"]}
          missing = []
          for name, feature in expected.items():
              package = packages.get(name)
              if package is None:
                  missing.append(f"{name} (package missing)")
              elif feature not in package.get("features", {}):
                  missing.append(f"{name}:{feature}")
          if missing:
              print("missing expected OpenSSL feature(s): " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)
          print("expected OpenSSL features present: " + ", ".join(f"{k}:{v}" for k, v in expected.items()))
          PY

      - name: Format crypto-related crates in CI and record patch
        # Formatting is intentionally applied before tests, not used as a
        # blocking `--check` gate: this repository formats only in Actions, and
        # an unformatted branch must not hide real compile/test evidence.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p boreas-crypto -p boreas-pki -p boreas-tunnel -p boreas-supervisor -p boreas-cli -p boreas-dns
          git diff --binary > rust-tls-format.patch || true
          if [ -s rust-tls-format.patch ]; then
            echo '::warning title=Formatting patch produced::Review rust-tls-format.patch; this job did not commit it.'
          fi
      - name: Format check (non-blocking lint, after formatting)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Real pq768 mTLS, payload-queue byte stream, and fail-closed cases
        if: always()
        timeout-minutes: 15
        shell: bash
        env:
          OPENSSL_DIR: ${{ github.workspace }}/.rust-tls-openssl
          OPENSSL_STATIC: '1'
        run: |
          set -o pipefail
          cargo test --locked -p boreas-crypto --features openssl-backend \
            -- --test-threads="$(nproc)" --nocapture 2>&1 | tee rust-tls-tests.log
      - name: PKI management, CSR, and signing tests with real OpenSSL
        if: always()
        timeout-minutes: 15
        shell: bash
        env:
          OPENSSL_DIR: ${{ github.workspace }}/.rust-tls-openssl
          OPENSSL_STATIC: '1'
        run: |
          set -o pipefail
          cargo test --locked -p boreas-pki --features openssl-backend \
            -- --test-threads="$(nproc)" --nocapture 2>&1 | tee rust-tls-pki-tests.log
          grep -Fx 'test management::tests::scoped_revocations_persist_and_invalidate_only_owned_bindings ... ok' rust-tls-pki-tests.log
      - name: Transport inner-TLS seam tests with backend feature
        if: always()
        timeout-minutes: 15
        shell: bash
        env:
          OPENSSL_DIR: ${{ github.workspace }}/.rust-tls-openssl
          OPENSSL_STATIC: '1'
        run: |
          set -euo pipefail
          # The transport crate's feature-gated module is owned by the
          # transport-runtime slice.  Fail explicitly instead of silently
          # skipping the seam test if that module has not landed yet.
          test -f crates/boreas-tunnel/src/openssl_inner_tls.rs
          set -o pipefail
          cargo test --locked -p boreas-tunnel --features openssl-inner-tls \
            -- --test-threads=4 --nocapture 2>&1 | tee rust-tls-tunnel-tests.log
          for test in \
            'circuit_pool::retirement_tests::two_endpoints_wrap_data_half_close_and_retry_without_rebinding' \
            'circuit_pool::retirement_tests::wrong_lane_corrupt_fin_invalid_ack_and_reset_do_not_retire' \
            'circuit_pool::retirement_tests::bounded_guard_pressure_never_evicts_and_recovers_on_expiry' \
            'circuit_pool::retirement_tests::incomplete_handshake_and_one_sided_close_have_no_idle_expiry' \
            'shared_directory_listener_discovers_provisioned_spkis_and_rejects_unlisted_core' \
            'authenticated_forwarded_core_lsa_fork_preserves_both_envelopes_and_blocks_restart' \
            'live_relay_denial_interrupts_idle_e2e_and_releases_both_hops' \
            'live_directory_propagates_remote_denial_after_graph_isolation'; do
            grep -Fx "test $test ... ok" rust-tls-tunnel-tests.log
          done
      - name: Supervisor release-manifest dual-signature tests with real OpenSSL
        if: always()
        timeout-minutes: 15
        shell: bash
        env:
          OPENSSL_DIR: ${{ github.workspace }}/.rust-tls-openssl
          OPENSSL_STATIC: '1'
        run: |
          set -o pipefail
          cargo test --locked -p boreas-supervisor --features openssl-backend \
            -- --test-threads="$(nproc)" --nocapture 2>&1 | tee rust-tls-supervisor-tests.log
      - name: CLI hop-node & daemon process tests with backend feature
        if: always()
        timeout-minutes: 15
        shell: bash
        env:
          OPENSSL_DIR: ${{ github.workspace }}/.rust-tls-openssl
          OPENSSL_STATIC: '1'
        run: |
          set -o pipefail
          cargo clippy --locked -p boreas-pki -p boreas-tunnel -p boreas-cli \
            --features boreas-cli/openssl-inner-tls --all-targets -- -D warnings
          cargo test --locked -p boreas-cli --features openssl-inner-tls \
            -- --test-threads="$(nproc)" --nocapture 2>&1 | tee rust-tls-cli-tests.log
          for test in \
            'update::signed::tests::authenticates_exact_manifest_and_reports_metadata_only' \
            'update::signed::tests::requires_both_signatures_exact_bytes_and_local_root' \
            'update::signed::tests::stops_on_transport_error_or_short_signature_and_never_falls_back' \
            'update::signed::online::tests::no_artifact_request_before_both_signatures_and_exact_operator_approval' \
            'update::signed::online::tests::rejects_redirect_timeout_wrong_size_digest_elf_and_expiry_before_handoff' \
            'update::signed::online::tests::prepares_exact_nonexecutable_inputs_for_existing_apply_then_removes_spool'; do
            grep -Fx "test $test ... ok" rust-tls-cli-tests.log
          done
          grep -E '^test [[:alnum:]_:]+::offline_pool_migration_cli_roundtrip_with_pinned_root_and_no_overwrite \.\.\. ok$' rust-tls-cli-tests.log
      - name: DNS authority, dispatch, and packet transport tests
        if: always()
        timeout-minutes: 5
        env:
          OPENSSL_DIR: ${{ github.workspace }}/.rust-tls-openssl
          OPENSSL_STATIC: '1'
        run: |
          set -euo pipefail
          cargo test --locked -p boreas-dns 2>&1 | tee rust-tls-dns-tests.log
          cargo test --locked -p boreas-dns --features secure-upstream 2>&1 | tee -a rust-tls-dns-tests.log
          grep -Fx 'test secure_upstream::tests::doh_rejects_noncanonical_framing_without_retry ... ok' rust-tls-dns-tests.log
      - name: Test policy fixture encoding helpers
        if: always()
        run: python -m unittest discover -s tools/release -p 'test_network_policy_test_fixture.py'
      - name: Build Linux pq768 E2E daemon binary (glibc + static musl) & run real netns ping
        if: success()
        timeout-minutes: 25
        env:
          OPENSSL_DIR: ${{ github.workspace }}/.rust-tls-openssl
          OPENSSL_STATIC: '1'
        run: |
          set -euo pipefail
          cargo build --locked --release -p boreas-cli --features openssl-inner-tls
          sudo modprobe tun || true
          sudo -E bash tools/release/netns_daemon_smoke.sh target/release/boreas \
            2>&1 | tee rust-tls-netns-e2e.log

          mkdir -p hop-node-linux
          cp target/release/boreas hop-node-linux/boreas

          # Also build a zero-glibc-dependency static x86_64-unknown-linux-musl binary
          # linked against musl-compiled OpenSSL 4.1.1-dev for portable Linux pre-releases.
          rustup target add x86_64-unknown-linux-musl
          OPENSSL_MUSL_PREFIX="${GITHUB_WORKSPACE}/.rust-tls-openssl-musl"
          mkdir -p openssl-musl-src
          tar -xzf openssl.tar.gz --strip-components=1 -C openssl-musl-src
          # Expose kernel UAPI headers without adding glibc's include root to
          # musl-gcc. OpenSSL's secure-memory code includes linux/mman.h.
          MUSL_UAPI="${GITHUB_WORKSPACE}/.musl-kernel-headers"
          mkdir -p "$MUSL_UAPI"
          ln -s /usr/include/linux "$MUSL_UAPI/linux"
          ln -s /usr/include/asm-generic "$MUSL_UAPI/asm-generic"
          ln -s /usr/include/x86_64-linux-gnu/asm "$MUSL_UAPI/asm"
          pushd openssl-musl-src
          CC=musl-gcc ./Configure linux-x86_64 no-quic no-cms no-siv no-shared no-tests no-async \
            -isystem "$MUSL_UAPI" \
            --prefix="${OPENSSL_MUSL_PREFIX}" --openssldir="${OPENSSL_MUSL_PREFIX}/ssl"
          make -j"$(nproc)"
          make install_sw
          popd
          mkdir -p "${OPENSSL_MUSL_PREFIX}/ssl"
          cp "${OPENSSL_PREFIX}/ssl/openssl.cnf" "${OPENSSL_MUSL_PREFIX}/ssl/openssl.cnf"
          bash tools/dependencies/verify-openssl-build.sh \
            openssl-musl-src "${OPENSSL_MUSL_PREFIX}" \
            "${GITHUB_WORKSPACE}/openssl-musl-runtime.txt" \
            "${GITHUB_WORKSPACE}/openssl-musl-build.txt"
          OPENSSL_DIR="${OPENSSL_MUSL_PREFIX}" OPENSSL_STATIC=1 \
            cargo build --locked --release --target x86_64-unknown-linux-musl \
              -p boreas-cli --features openssl-inner-tls
          cp target/x86_64-unknown-linux-musl/release/boreas hop-node-linux/boreas-linux-x86_64-musl-pq768
          python tools/release/verify_static_linux.py \
            --binary hop-node-linux/boreas-linux-x86_64-musl-pq768 \
            --target x86_64-unknown-linux-musl \
            --out hop-node-linux/static-linkage-pq768.json
          sudo -E bash tools/release/netns_daemon_smoke.sh hop-node-linux/boreas-linux-x86_64-musl-pq768 \
            2>&1 | tee -a rust-tls-netns-e2e.log

          printf '%s\n' \
            'BOREAS PQ768 E2E DAEMON PRE-RELEASE BINARIES - NOT A PRODUCTION RELEASE' \
            'Source commit: '"$GITHUB_SHA" \
            'Feature: openssl-inner-tls (OpenSSL 4.1.0 no-quic/no-cms/no-siv; X25519MLKEM768 + ML-DSA-65)' \
            'Included binaries:' \
            '  - boreas: x86_64-unknown-linux-gnu (static libcrypto/libssl)' \
            '  - boreas-linux-x86_64-musl-pq768: fully static x86_64-unknown-linux-musl' \
            'Verified end-to-end in CI: offline PKI -> mounted roots.cbor -> WSS + pq768 hop + pq768 E2E + real Linux netns /dev/net/tun ICMP latency and 8 MiB integrity/throughput probes.' \
            'Production gates in docs/engineering/gates.json remain OPEN; production_approved is false.' \
            > hop-node-linux/README-DEVELOPMENT.txt
          (cd hop-node-linux && sha256sum boreas boreas-linux-x86_64-musl-pq768 > SHA256SUMS)
      - name: Authenticated offline stage, real non-root systemd readiness and rollback
        if: success()
        timeout-minutes: 8
        env:
          OPENSSL_DIR: ${{ github.workspace }}/.rust-tls-openssl
          OPENSSL_STATIC: '1'
        run: |
          set -euo pipefail
          cargo build --locked --release -p boreas-supervisor --features openssl-backend
          musl-gcc -static -Os tools/deploy/ci-release-failure.c -o "$RUNNER_TEMP/release-failure-ci"
          musl-gcc -static -Os -DWAIT_FOR_SUPERVISOR_KILL tools/deploy/ci-release-failure.c -o "$RUNNER_TEMP/release-wait-ci"
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" OPENSSL_CONF="$OPENSSL_CONF" \
            bash tools/deploy/test-verified-systemd.sh \
            "$PWD/hop-node-linux/boreas-linux-x86_64-musl-pq768" \
            "$PWD/target/release/boreas-supervisor" "$BOREAS_OPENSSL_BIN" \
            "$RUNNER_TEMP/release-failure-ci" "$RUNNER_TEMP/release-wait-ci" 2>&1 | tee rust-tls-verified-systemd.log
      - name: Same-identity initial TCP backup E2E (closed primary, configured backup)
        if: success()
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          variant_dir="$(mktemp -d "$RUNNER_TEMP/initial-backup-smoke.XXXXXX")"
          trap 'rm -rf -- "$variant_dir"' EXIT
          cp tools/release/netns_daemon_smoke.sh tools/release/netns_overlay_perf.py tools/release/network_policy_test_fixture.py "$variant_dir"/
          python3 - "$variant_dir/netns_daemon_smoke.sh" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          edge_before = '''state_dir = "$EDGE_STATE"
          [uplink]
          primary = "wss.boreas.test:8443"
          paths = 4
          probe_paths = 1
          '''
          edge_after = '''state_dir = "$EDGE_STATE"
          [uplink]
          primary = "192.0.2.1:8444"
          backup = "192.0.2.1:8443"
          paths = 4
          probe_paths = 1
          '''
          assert source.count(edge_before) == 1, "edge [uplink] block must occur exactly once"
          source = source.replace(edge_before, edge_after)

          connect_before = '  --connect "192.0.2.1:8443" \\\n'
          assert source.count(connect_before) == 1, "edge --connect line must occur exactly once"
          source = source.replace(connect_before, "")

          path.write_text(source, encoding="utf-8")
          PY
          sudo -E bash "$variant_dir/netns_daemon_smoke.sh" hop-node-linux/boreas \
            2>&1 | tee rust-tls-initial-backup.log
      - name: 'Negative: initial outer-TLS rejection must fail closed (backup untouched)'
        # Negative counterpart of the step above. The configured primary endpoint
        # accepts TCP and then answers the outer TLS handshake with bytes that are
        # not a TLS record; a genuinely usable backup is configured at the same
        # time (the real core daemon, reached through a counting TCP proxy). The
        # edge daemon must exit nonzero and must never dial the backup.
        #
        # The observation is not message matching:
        #   * primary mock accepted >= 1 TCP connection -> the primary was reachable
        #   * edge daemon exit status 2                 -> the product failed closed
        #   * backup proxy accepted connections == 0    -> the backup was never dialed
        #   * core `ctl status` inbound_connections==0  -> no backup session existed
        #   * a post-negative control connect through the same backup proxy succeeds
        #     (status ok) and moves that counter to exactly 1, which proves the zero
        #     above is a real "not used" and the backup really was usable.
        #
        # This harness is deliberately independent of the netns smoke: the smoke's
        # single success path cannot be turned into an expected-failure run by
        # strict `replace count == 1` edits, and no Rust, smoke or perf file is
        # touched here. `--virtual-tun` is used because the failure happens before
        # any business traffic; the positive smoke above still covers the real
        # netns/TUN path.
        if: success()
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a rust-tls-initial-backup-negative.log) 2>&1

          BIN="$PWD/hop-node-linux/boreas"
          test -x "$BIN"
          NEG_ROOT="$(mktemp -d "$RUNNER_TEMP/initial-backup-negative.XXXXXX")"
          NEG="$NEG_ROOT/work"
          mkdir -p "$NEG"
          chmod 0700 "$NEG_ROOT" "$NEG"
          OWNER_UID="$(id -u)"

          PRIMARY_PORT=18445
          BACKUP_PORT=18446
          CORE_PORT=18447
          # Only the processes this step starts are ever signalled and waited
          # for. A bare `wait` must not be used here: the `exec > >(tee ...)`
          # above makes `tee` a shell child that is not in this array, and a
          # bare `wait` would also wait for it while `tee` waits for this shell
          # to close the pipe, i.e. it deadlocks until the step timeout.
          CHILD_PIDS=()
          cleanup() {
            set +e
            local live_pids pid
            live_pids=" $(jobs -pr | tr '\n' ' ') "
            for pid in "${CHILD_PIDS[@]}"; do
              # Intersect with live jobs so a recycled (stale) PID is never killed.
              if [[ "$live_pids" == *" $pid "* ]]; then
                kill -KILL "$pid" 2>/dev/null || true
              fi
            done
            # Wait only for captured children, never for `tee`.
            for pid in "${CHILD_PIDS[@]}"; do
              wait "$pid" 2>/dev/null || true
            done
            rm -rf -- "$NEG_ROOT"
          }
          trap cleanup EXIT

          for port in "$PRIMARY_PORT" "$BACKUP_PORT" "$CORE_PORT"; do
            if ss -ltn "sport = :$port" 2>/dev/null | grep -q LISTEN; then
              echo "ERROR: TCP port $port is already in use" >&2
              exit 1
            fi
          done

          # Fresh PKI with the same provisioning commands as the netns smoke.
          # Node certificates use an explicit 12 h lifetime so the leaf notAfter
          # can never race past the 30-day issuer notAfter computed a moment
          # earlier (issue-node defaults to 720 h, i.e. the whole CA span).
          "$BIN" pki init-ca \
            --ca-dir "$NEG/ca" \
            --net-id "0123456789abcdef0123456789abcdef" \
            --validity-days 30
          "$BIN" pki issue-node \
            --ca-dir "$NEG/ca" --out-dir "$NEG/core-mat" \
            --role core --home-core 1 --vip-octet 1 --validity-hours 12 \
            --outer-san "wss.boreas.test"
          "$BIN" pki issue-node \
            --ca-dir "$NEG/ca" --out-dir "$NEG/edge-mat" \
            --role edge --home-core 1 --vip-octet 2 --validity-hours 12
          cp "$NEG/core-mat/local.signed" "$NEG/edge-mat/peer.signed"
          cp "$NEG/edge-mat/local.signed" "$NEG/core-mat/peer.signed"
          "$BIN" pki verify-bundle --material-dir "$NEG/core-mat" --require-peer
          "$BIN" pki verify-bundle --material-dir "$NEG/edge-mat" --require-peer

          CORE_STATE="$NEG/core-state"
          EDGE_STATE="$NEG/edge-state"
          CONTROL_STATE="$NEG/edge-control-state"
          mkdir -p "$CORE_STATE" "$EDGE_STATE" "$CONTROL_STATE"
          chmod 0700 "$CORE_STATE" "$EDGE_STATE" "$CONTROL_STATE"
          # Use the same offline root as these nodes, and copy only public inputs.
          POLICY_FIXTURE="$NEG/policy"
          "$BIN" pki sign-policy --ca-dir "$NEG/ca" --out-dir "$POLICY_FIXTURE" \
            --sequence 1 --ttl-seconds 3600 >/dev/null
          for state in "$CORE_STATE" "$EDGE_STATE" "$CONTROL_STATE"; do
            for name in tbs.cbor ed25519.sig mldsa65.sig root-ed25519.der root-mldsa65.der; do
              install -m 0600 "$POLICY_FIXTURE/$name" "$state/$name"
            done
          done

          cat > "$NEG/core.toml" <<EOF
          version = 2
          [node]
          net_id = "0123456789abcdef0123456789abcdef"
          role = "core"
          home_core_id = 1
          vip_octet = 1
          node_id = 1
          identity_generation = 1
          security_mode = "e2e-required"
          suite = "pq768"
          [paths]
          identity_key = "$NEG/core-mat/identity.key"
          roots = ["$NEG/core-mat/roots.cbor"]
          state_dir = "$CORE_STATE"
          [uplink]
          primary = "127.0.0.1:$CORE_PORT"
          paths = 4
          probe_paths = 1
          EOF
          chmod 0600 "$NEG/core.toml"

          cat > "$NEG/edge.toml" <<EOF
          version = 2
          [node]
          net_id = "0123456789abcdef0123456789abcdef"
          role = "edge"
          home_core_id = 1
          vip_octet = 2
          node_id = 2
          identity_generation = 1
          security_mode = "e2e-required"
          suite = "pq768"
          [paths]
          identity_key = "$NEG/edge-mat/identity.key"
          roots = ["$NEG/edge-mat/roots.cbor"]
          state_dir = "$EDGE_STATE"
          [uplink]
          primary = "127.0.0.1:$PRIMARY_PORT"
          backup = "127.0.0.1:$BACKUP_PORT"
          paths = 4
          probe_paths = 1
          EOF
          chmod 0600 "$NEG/edge.toml"

          # Same identity and material, separate state dir so the control connect
          # later does not collide with the negative daemon's control socket.
          cat > "$NEG/edge-control.toml" <<EOF
          version = 2
          [node]
          net_id = "0123456789abcdef0123456789abcdef"
          role = "edge"
          home_core_id = 1
          vip_octet = 2
          node_id = 2
          identity_generation = 1
          security_mode = "e2e-required"
          suite = "pq768"
          [paths]
          identity_key = "$NEG/edge-mat/identity.key"
          roots = ["$NEG/edge-mat/roots.cbor"]
          state_dir = "$CONTROL_STATE"
          [uplink]
          primary = "127.0.0.1:$BACKUP_PORT"
          paths = 4
          probe_paths = 1
          EOF
          chmod 0600 "$NEG/edge-control.toml"

          # Mock primary: TCP-connectable, but the first server bytes are not a
          # TLS record, so the outer handshake is rejected after a successful TCP
          # connect. Each accepted connection is counted independently of the
          # daemon's own diagnostics.
          cat > "$NEG/mock_primary.py" <<'PY'
          import pathlib
          import socket
          import sys
          import time

          port = int(sys.argv[1])
          counter = pathlib.Path(sys.argv[2])
          deadline = time.monotonic() + 120.0
          server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          server.bind(("127.0.0.1", port))
          server.listen(8)
          server.settimeout(1.0)
          while time.monotonic() < deadline:
              try:
                  conn, _ = server.accept()
              except socket.timeout:
                  continue
              except OSError:
                  break
              with counter.open("a", encoding="utf-8") as handle:
                  handle.write("accept\n")
                  handle.flush()
              try:
                  conn.settimeout(5.0)
                  try:
                      conn.recv(4096)  # consume the ClientHello; the failure is after TCP
                  except OSError:
                      pass
                  conn.sendall(b"NOT-A-TLS-RECORD\r\n")
                  conn.shutdown(socket.SHUT_WR)
                  time.sleep(0.2)
              except OSError:
                  pass
              finally:
                  conn.close()
          PY

          # Backup endpoint: a transparent byte proxy in front of the real core
          # daemon. It counts every accepted connection, so a fallback to the
          # configured backup is observable at the network level even if it never
          # reaches a session.
          cat > "$NEG/counting_proxy.py" <<'PY'
          import pathlib
          import select
          import socket
          import sys
          import threading
          import time

          listen_port = int(sys.argv[1])
          upstream_port = int(sys.argv[2])
          counter = pathlib.Path(sys.argv[3])

          def pump(conn):
              with counter.open("a", encoding="utf-8") as handle:
                  handle.write("accept\n")
                  handle.flush()
              try:
                  upstream = socket.create_connection(("127.0.0.1", upstream_port), timeout=5.0)
              except OSError:
                  conn.close()
                  return
              # Bounded: a stalled peer can never block this thread forever.
              conn.settimeout(30.0)
              upstream.settimeout(30.0)
              try:
                  while True:
                      readable, _, _ = select.select([conn, upstream], [], [], 30.0)
                      if not readable:
                          return
                      for source in readable:
                          data = source.recv(65536)
                          if not data:
                              return
                          (upstream if source is conn else conn).sendall(data)
              except OSError:
                  return
              finally:
                  conn.close()
                  upstream.close()

          server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          server.bind(("127.0.0.1", listen_port))
          server.listen(8)
          server.settimeout(1.0)
          deadline = time.monotonic() + 300.0
          while time.monotonic() < deadline:
              try:
                  conn, _ = server.accept()
              except socket.timeout:
                  continue
              except OSError:
                  break
              threading.Thread(target=pump, args=(conn,), daemon=True).start()
          PY

          python3 "$NEG/mock_primary.py" "$PRIMARY_PORT" "$NEG/primary-accepts.log" \
            > "$NEG/mock-primary.out" 2>&1 &
          CHILD_PIDS+=("$!")
          python3 "$NEG/counting_proxy.py" "$BACKUP_PORT" "$CORE_PORT" "$NEG/backup-accepts.log" \
            > "$NEG/proxy.out" 2>&1 &
          CHILD_PIDS+=("$!")

          # The backup itself is the real core daemon (usable by construction).
          "$BIN" daemon serve \
            --config "$NEG/core.toml" \
            --material-dir "$NEG/core-mat" \
            --status-state-file "$CORE_STATE/status.state" --status-state-owner-uid "$OWNER_UID" \
            --network-policy-tbs "$CORE_STATE/tbs.cbor" \
            --network-policy-ed25519-signature "$CORE_STATE/ed25519.sig" \
            --network-policy-mldsa65-signature "$CORE_STATE/mldsa65.sig" \
            --network-root-ed25519-der "$CORE_STATE/root-ed25519.der" \
            --network-root-mldsa65-der "$CORE_STATE/root-mldsa65.der" \
            --network-policy-state-file "$CORE_STATE/network-policy.state" \
            --network-policy-state-owner-uid "$OWNER_UID" \
            --listen "127.0.0.1:$CORE_PORT" \
            --virtual-tun \
            --max-seconds 120 \
            > "$NEG/core.out" 2> "$NEG/core.err" &
          CHILD_PIDS+=("$!")

          LISTENING=0
          for _ in $(seq 1 200); do
            if ss -ltn "sport = :$PRIMARY_PORT" 2>/dev/null | grep -q LISTEN \
               && ss -ltn "sport = :$BACKUP_PORT" 2>/dev/null | grep -q LISTEN \
               && ss -ltn "sport = :$CORE_PORT" 2>/dev/null | grep -q LISTEN; then
              LISTENING=1
              break
            fi
            sleep 0.05
          done
          if (( LISTENING != 1 )); then
            echo 'ERROR: primary mock, backup proxy or core listener never came up' >&2
            cat "$NEG/core.err" >&2 || true
            exit 1
          fi
          for _ in $(seq 1 100); do
            if "$BIN" ctl status --socket "$CORE_STATE/control.sock" >/dev/null 2>&1; then
              break
            fi
            sleep 0.05
          done

          # No `--connect` override: initial endpoint selection must use the
          # configured `[uplink]` primary + backup exactly like the positive step.
          set +e
          "$BIN" daemon connect \
            --config "$NEG/edge.toml" \
            --material-dir "$NEG/edge-mat" \
            --status-state-file "$EDGE_STATE/status.state" --status-state-owner-uid "$OWNER_UID" \
            --network-policy-tbs "$EDGE_STATE/tbs.cbor" \
            --network-policy-ed25519-signature "$EDGE_STATE/ed25519.sig" \
            --network-policy-mldsa65-signature "$EDGE_STATE/mldsa65.sig" \
            --network-root-ed25519-der "$EDGE_STATE/root-ed25519.der" \
            --network-root-mldsa65-der "$EDGE_STATE/root-mldsa65.der" \
            --network-policy-state-file "$EDGE_STATE/network-policy.state" \
            --network-policy-state-owner-uid "$OWNER_UID" \
            --tls-name "wss.boreas.test" \
            --ws-host "wss.boreas.test:$PRIMARY_PORT" \
            --virtual-tun \
            --max-seconds 10 \
            > "$NEG/negative.out" 2> "$NEG/negative.err"
          NEG_RC=$?
          set -e

          count_accepts() {
            local file="$1"
            if [[ -f "$file" ]]; then
              grep -c '^accept$' "$file" || true
            else
              echo 0
            fi
          }

          PRIMARY_ACCEPTS=0
          for _ in $(seq 1 40); do
            PRIMARY_ACCEPTS="$(count_accepts "$NEG/primary-accepts.log")"
            if (( PRIMARY_ACCEPTS >= 1 )); then
              break
            fi
            sleep 0.05
          done
          BACKUP_ACCEPTS="$(count_accepts "$NEG/backup-accepts.log")"
          CORE_CTL="$("$BIN" ctl status --socket "$CORE_STATE/control.sock" 2>&1 || true)"

          echo "initial_backup_negative.primary_tcp_accepts=$PRIMARY_ACCEPTS"
          echo "initial_backup_negative.backup_tcp_accepts=$BACKUP_ACCEPTS"
          echo "initial_backup_negative.edge_exit_code=$NEG_RC"
          echo "initial_backup_negative.core_ctl=$CORE_CTL"

          FAILED=0
          if (( NEG_RC != 2 )); then
            echo "ERROR: edge daemon exit status $NEG_RC, expected 2 (fail closed)" >&2
            FAILED=1
          fi
          if (( PRIMARY_ACCEPTS < 1 )); then
            echo 'ERROR: primary endpoint never accepted a TCP connection; the run did not test outer-TLS rejection' >&2
            FAILED=1
          fi
          if (( BACKUP_ACCEPTS != 0 )); then
            echo "ERROR: edge daemon dialed the configured backup $BACKUP_ACCEPTS time(s) after the primary outer TLS was rejected" >&2
            FAILED=1
          fi
          if ! grep -q '"inbound_connections":0' <<<"$CORE_CTL"; then
            echo "ERROR: backup core reports a session; core ctl status was: $CORE_CTL" >&2
            FAILED=1
          fi
          if ! grep -q '"daemon_connected":false' <<<"$CORE_CTL"; then
            echo "ERROR: backup core reports a connected peer; core ctl status was: $CORE_CTL" >&2
            FAILED=1
          fi
          if grep -q '"status":"ok"' "$NEG/negative.out"; then
            echo 'ERROR: negative edge daemon reported status ok' >&2
            FAILED=1
          fi
          if (( FAILED != 0 )); then
            echo '--- negative edge stderr ---' >&2
            cat "$NEG/negative.err" >&2 || true
            echo '--- negative edge stdout ---' >&2
            cat "$NEG/negative.out" >&2 || true
            echo '--- backup core stderr ---' >&2
            cat "$NEG/core.err" >&2 || true
            exit 1
          fi

          # Instrument control: the same backup endpoint, proxy and core process
          # must carry a real session when it is the only configured endpoint.
          set +e
          "$BIN" daemon connect \
            --config "$NEG/edge-control.toml" \
            --material-dir "$NEG/edge-mat" \
            --status-state-file "$CONTROL_STATE/status.state" --status-state-owner-uid "$OWNER_UID" \
            --network-policy-tbs "$CONTROL_STATE/tbs.cbor" \
            --network-policy-ed25519-signature "$CONTROL_STATE/ed25519.sig" \
            --network-policy-mldsa65-signature "$CONTROL_STATE/mldsa65.sig" \
            --network-root-ed25519-der "$CONTROL_STATE/root-ed25519.der" \
            --network-root-mldsa65-der "$CONTROL_STATE/root-mldsa65.der" \
            --network-policy-state-file "$CONTROL_STATE/network-policy.state" \
            --network-policy-state-owner-uid "$OWNER_UID" \
            --connect "127.0.0.1:$BACKUP_PORT" \
            --tls-name "wss.boreas.test" \
            --ws-host "wss.boreas.test:$BACKUP_PORT" \
            --virtual-tun \
            --max-seconds 2 \
            > "$NEG/control.out" 2> "$NEG/control.err"
          CONTROL_RC=$?
          set -e
          BACKUP_ACCEPTS_AFTER="$(count_accepts "$NEG/backup-accepts.log")"
          echo "initial_backup_negative.backup_tcp_accepts_after_control=$BACKUP_ACCEPTS_AFTER"
          echo "initial_backup_negative.control_exit_code=$CONTROL_RC"

          if (( CONTROL_RC != 0 )); then
            echo "ERROR: control connect to the usable backup failed with status $CONTROL_RC" >&2
            cat "$NEG/control.err" >&2 || true
            exit 1
          fi
          if (( BACKUP_ACCEPTS_AFTER != 1 )); then
            echo "ERROR: backup proxy counted $BACKUP_ACCEPTS_AFTER connection(s), expected exactly 1" >&2
            exit 1
          fi
          if ! grep -q '"status":"ok"' "$NEG/control.out"; then
            echo "ERROR: control connect to the usable backup did not report status ok" >&2
            cat "$NEG/control.out" >&2 || true
            exit 1
          fi

          echo 'initial_backup_negative=pass'
          echo 'initial_backup_negative.backup_usable=control-connect-through-same-proxy-status-ok'
      - name: Upload hop-node development binary
        id: acceptance_binary
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: boreas-hop-node-linux-x86_64-${{ github.run_id }}
          path: hop-node-linux
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Build the mesh netns test and its debug daemon once
        id: mesh_build
        if: ${{ !cancelled() && steps.acceptance_binary.outcome == 'success' && github.repository == 'Lanlan13-14/Boreas' && ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/v111-handoff') || (github.ref == 'refs/heads/fix/v111-integration' || github.ref == 'refs/heads/test/v111-integrated-runtime') || github.ref == 'refs/heads/test/v111-mesh-runtime') }}
        timeout-minutes: 5
        env:
          OPENSSL_DIR: ${{ github.workspace }}/.rust-tls-openssl
          OPENSSL_STATIC: '1'
        run: |
          set -euo pipefail
          cargo test --locked -p boreas-cli --features openssl-inner-tls --test mesh_run_netns \
            --no-run --message-format=json > mesh-run-build.jsonl
          test_binary=$(python3 -c 'import json,sys; print(next(x["executable"] for x in map(json.loads, sys.stdin) if x.get("reason")=="compiler-artifact" and x["target"]["name"]=="mesh_run_netns" and x.get("executable")))' < mesh-run-build.jsonl)
          test -x "$test_binary"
          test -x target/debug/boreas
          mesh_dir="$(mktemp -d)"
          trap 'rm -rf "$mesh_dir"' EXIT
          cp "$test_binary" "$mesh_dir/mesh_run_netns"
          cp target/debug/boreas "$mesh_dir/boreas"
          mkdir -p acceptance-mesh
          tar -cf acceptance-mesh/mesh.tar -C "$mesh_dir" mesh_run_netns boreas
          printf '%s\n' "$GITHUB_SHA" > acceptance-mesh/source-sha
          (cd acceptance-mesh && sha256sum mesh.tar source-sha > SHA256SUMS)
      - name: Upload internal mesh executables
        id: acceptance_mesh_binary
        if: ${{ !cancelled() && steps.mesh_build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tls-mesh-executables-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-mesh/
          if-no-files-found: error
          retention-days: 14
      - name: Package the verified OpenSSL runtime
        id: acceptance_package
        if: ${{ !cancelled() && steps.acceptance_binary.outcome == 'success' && ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/v111-handoff') || (github.ref == 'refs/heads/fix/v111-integration' || github.ref == 'refs/heads/test/v111-integrated-runtime') || github.ref == 'refs/heads/fix/v111-release-blockers' || (github.repository == 'Lanlan13-14/Boreas' && (github.ref == 'refs/heads/test/v111-tcpv4-gso' || github.ref == 'refs/heads/test/v111-dns-public-forwarding' || github.ref == 'refs/heads/test/v111-dns-daemon' || github.ref == 'refs/heads/test/v111-dns-deployment-tcp' || github.ref == 'refs/heads/test/v111-mesh-runtime'))) }}
        run: |
          set -euo pipefail
          mkdir -p acceptance-runtime
          tar -cf acceptance-runtime/runtime.tar .rust-tls-openssl/bin/openssl .rust-tls-openssl/ssl/openssl.cnf
          printf '%s\n' "$GITHUB_SHA" > acceptance-runtime/source-sha
          (cd acceptance-runtime && sha256sum runtime.tar source-sha > SHA256SUMS)
      - name: Upload internal same-run acceptance runtime
        id: acceptance_runtime
        if: ${{ !cancelled() && steps.acceptance_package.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tls-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-runtime/
          if-no-files-found: error
          retention-days: 14
      - name: Upload non-secret CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tls-${{ github.run_id }}
          path: |
            openssl-runtime.txt
            openssl-build.txt
            openssl-musl-runtime.txt
            openssl-musl-build.txt
            openssl-linkage.txt
            rust-tls-format.patch
            rust-tls-tests.log
            rust-tls-pki-tests.log
            rust-tls-tunnel-tests.log
            rust-tls-supervisor-tests.log
            rust-tls-verified-systemd.log
            rust-tls-dns-tests.log
            rust-tls-cli-tests.log
            rust-tls-netns-e2e.log
            rust-tls-initial-backup.log
            rust-tls-initial-backup-negative.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  functional-netns:
    name: Functional netns / ${{ matrix.case }}
    needs: openssl-rust-mtls
    # Build failures still fail the workflow, but a failed mesh compile must
    # not suppress the other fixtures if the verified runtime was uploaded.
    if: ${{ !cancelled() && needs.openssl-rust-mtls.outputs.runtime_id != '' && github.repository == 'Lanlan13-14/Boreas' && ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/v111-handoff' || github.ref == 'refs/heads/feat/pq-wg-transport') || (github.ref == 'refs/heads/fix/v111-integration' || github.ref == 'refs/heads/test/v111-integrated-runtime') || github.ref == 'refs/heads/test/v111-dns-public-forwarding' || github.ref == 'refs/heads/test/v111-dns-daemon' || github.ref == 'refs/heads/test/v111-dns-deployment-tcp' || github.ref == 'refs/heads/test/v111-mesh-runtime') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/v111-handoff' || github.ref == 'refs/heads/feat/pq-wg-transport') && '["public_dns","private_dns","pool_cutover","dns_replicas","mesh","multi_active"]' ||
          (github.ref == 'refs/heads/fix/v111-integration' || github.ref == 'refs/heads/test/v111-integrated-runtime') && '["public_dns","private_dns","pool_cutover","dns_replicas","mesh"]' ||
          github.ref == 'refs/heads/test/v111-dns-public-forwarding' && '["public_dns"]' ||
          github.ref == 'refs/heads/test/v111-mesh-runtime' && '["mesh"]' ||
          '["private_dns"]') }}
    env:
      OPENSSL_CONF: ${{ github.workspace }}/.rust-tls-openssl/ssl/openssl.cnf
      BOREAS_OPENSSL_BIN: ${{ github.workspace }}/.rust-tls-openssl/bin/openssl
      BOREAS_REQUIRE_TLS_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.openssl-rust-mtls.outputs.binary_id }}
          path: hop-node-linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.openssl-rust-mtls.outputs.runtime_id }}
          path: acceptance-runtime
      - name: Verify and prepare the exact build for namespace tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (cd hop-node-linux && sha256sum --check --strict SHA256SUMS)
          grep -Fx "Source commit: $GITHUB_SHA" hop-node-linux/README-DEVELOPMENT.txt
          (cd acceptance-runtime && sha256sum --check --strict SHA256SUMS)
          test "$(cat acceptance-runtime/source-sha)" = "$GITHUB_SHA"
          tar -xf acceptance-runtime/runtime.tar
          test -x "$BOREAS_OPENSSL_BIN"
          test -s "$OPENSSL_CONF"
          chmod 0755 hop-node-linux/boreas-linux-x86_64-musl-pq768
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iputils-ping
          sudo modprobe tun || true
      - name: Verify opt-in DoH and DoT on isolated real Core and Edge TUNs
        id: acceptance_public_dns
        if: matrix.case == 'public_dns'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          fixture() {
            local mode="$1" trust="$2" expected="$3"
            local log="rust-tls-public-dns-$1-$2.log"
            sudo -E env BOREAS_NETNS_PUBLIC_DNS="$mode" BOREAS_NETNS_PUBLIC_DNS_CASE="$trust" \
              timeout --kill-after=5s 35s bash tools/release/netns_daemon_smoke.sh \
              hop-node-linux/boreas-linux-x86_64-musl-pq768 2>&1 | tee "$log"
            grep -Fx "public_dns[$mode/$trust]=$expected" "$log"
          }
          for mode in doh dot; do
            fixture "$mode" good authenticated_udp_tcp_no_leak_no_fallback
            fixture "$mode" wrong-ca tls_rejected_before_query_no_fallback
            fixture "$mode" wrong-san tls_rejected_before_query_no_fallback
          done
          fixture doh no-grant startup_rejected_without_upstream
      - name: Verify opt-in private DNS on real Core and Edge TUNs
        id: acceptance_private_dns
        if: matrix.case == 'private_dns'
        timeout-minutes: 3
        env:
          BOREAS_NETNS_PRIVATE_DNS: '1'
        run: |
          set -euo pipefail
          sudo -E timeout --kill-after=5s 120s bash tools/release/netns_daemon_smoke.sh \
            hop-node-linux/boreas-linux-x86_64-musl-pq768 \
            2>&1 | tee rust-tls-private-dns.log
          grep -Fx 'private_dns=verified_signed_a_nxdomain_and_out_of_scope_drop' rust-tls-private-dns.log
          grep -Fx 'private_dns_rrset=verified_complete_a_and_tc_without_partial_answers' rust-tls-private-dns.log
          grep -Fx 'private_dns_tcp=verified_split_prefix_pipelining_full_rrset_and_fin' rust-tls-private-dns.log
          grep -Fx 'private_dns_tcp_denials=scope_frame_port_and_idle_timeout' rust-tls-private-dns.log
          grep -Fx 'private_dns_tcp_pin_withdrawal=no_later_dns_data_on_open_stream' rust-tls-private-dns.log
          grep -Fx 'private_dns_socket_audit=no_udp_socket_or_tcp53_listener_observed' rust-tls-private-dns.log
          grep -Fx 'private_dns_pin_withdrawal=core_halted_fail_closed' rust-tls-private-dns.log
      - name: Verify signed IPv4 cutover on two real Linux TUNs
        id: acceptance_pool_cutover
        if: matrix.case == 'pool_cutover'
        timeout-minutes: 3
        env:
          BOREAS_NETNS_POOL_CUTOVER: '1'
        run: |
          set -euo pipefail
          sudo -E timeout --kill-after=5s 120s bash tools/release/netns_daemon_smoke.sh \
            hop-node-linux/boreas-linux-x86_64-musl-pq768 2>&1 | tee rust-tls-pool-cutover.log
          grep -Fx 'pool_cutover_offline=check_and_commit_no_network_legacy_refused' rust-tls-pool-cutover.log
          grep -Fx 'pool_cutover_data=bidirectional_new_vips_and_old_vips_dropped' rust-tls-pool-cutover.log
          grep -Fx 'pool_cutover_revocation=source_denial_halted_successor_and_survived_restart' rust-tls-pool-cutover.log
      - name: Verify private DNS replica selection on three real Linux TUNs
        id: acceptance_dns_replicas
        if: matrix.case == 'dns_replicas'
        timeout-minutes: 4
        env:
          BOREAS_NETNS_PRIVATE_DNS: '1'
          BOREAS_NETNS_DNS_REPLICAS: '1'
        run: |
          set -euo pipefail
          sudo -E timeout --kill-after=5s 180s bash tools/release/netns_daemon_smoke.sh \
            hop-node-linux/boreas-linux-x86_64-musl-pq768 \
            2>&1 | tee rust-tls-dns-replicas.log
          grep -Fx 'dns_replica_grant=ungranted_backup_rejected_before_dial' rust-tls-dns-replicas.log
          grep -Fx 'dns_replica_startup=refused_primary_selected_distinct_authenticated_backup' rust-tls-dns-replicas.log
          grep -Fx 'dns_replica_tls=wrong_server_name_terminal_no_fallback' rust-tls-dns-replicas.log
          grep -Fx 'dns_replica_identity=wrong_pq_peer_terminal_no_fallback' rust-tls-dns-replicas.log
          grep -Fx 'dns_replica_pin_match=different_valid_remote_pin_terminal_no_fallback' rust-tls-dns-replicas.log
          grep -Fx 'dns_replica_packet_scope=ordinary_overlay_denied_in_both_directions' rust-tls-dns-replicas.log
          grep -Fx 'dns_replica_live=authenticated_close_promoted_once_with_fresh_udp_and_tcp_only' rust-tls-dns-replicas.log
          grep -Fx 'dns_replica_exhausted=withdrawn_backup_did_not_reopen_primary' rust-tls-dns-replicas.log
          grep -Fx 'dns_replica_withdrawal=abrupt_primary_pin_loss_terminal_while_backup_available' rust-tls-dns-replicas.log
          grep -Fx 'dns_replica_status=valid_new_sequence_retired_pinned_lease_without_fallback' rust-tls-dns-replicas.log
          grep -Fx 'dns_replica_revocation=revoked_backup_denied_before_dial_and_after_mailbox_removal' rust-tls-dns-replicas.log
      - name: Download the same-build mesh test and daemon
        if: matrix.case == 'mesh' && needs.openssl-rust-mtls.outputs.mesh_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.openssl-rust-mtls.outputs.mesh_id }}
          path: acceptance-mesh
      - name: Verify four-process Core routing, failover, and revocation on real TUN
        id: acceptance_mesh
        if: matrix.case == 'mesh'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          (
            cd acceptance-mesh
            sha256sum --check --strict SHA256SUMS
            test "$(cat source-sha)" = "$GITHUB_SHA"
            tar -xf mesh.tar
            test -x boreas
            test -x mesh_run_netns
          )
          export BOREAS_MESH_TEST_BIN="$PWD/acceptance-mesh/boreas"
          sudo --preserve-env=OPENSSL_CONF,BOREAS_OPENSSL_BIN,BOREAS_MESH_TEST_BIN timeout --kill-after=5s 120s \
            acceptance-mesh/mesh_run_netns --ignored --nocapture --test-threads=1 2>&1 | tee rust-tls-mesh-runtime.log
          for test in \
            mesh_run_real_tun_switches_to_fresh_backup_after_confirmed_relay_loss \
            mesh_routed_tun_derives_paths_and_reuses_ingress_after_relay_loss \
            mesh_routed_tun_live_revocation_excludes_relay_and_preserves_healthy_path \
            mesh_root_core_revocation_withdraws_owned_path_but_keeps_admin_routes; do
            grep -E "^test ${test} .* ok$" rust-tls-mesh-runtime.log
          done
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored' rust-tls-mesh-runtime.log
      - name: Verify 2–4 independent encrypted circuits on real Linux devices
        id: acceptance_multi_active
        if: matrix.case == 'multi_active'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for lanes in 2 3 4; do
            sudo -E env BOREAS_NETNS_E2E_ACTIVE_LANES="$lanes" \
              timeout --kill-after=5s 75s bash tools/release/netns_daemon_smoke.sh \
              hop-node-linux/boreas-linux-x86_64-musl-pq768 \
              2>&1 | tee "rust-tls-multi-active-${lanes}.log"
            log="rust-tls-multi-active-${lanes}.log"
            test "$(grep -Fxc 'multi_active_lane_loss=healthy_circuit_forwarding' "$log")" -eq 1
            test "$(grep -Fxc 'multi_active_lane_replacement=fresh_authenticated_circuit' "$log")" -eq 1
          done
      - name: Require the selected real-device fixture to have passed
        if: ${{ !cancelled() }}
        env:
          CASE: ${{ matrix.case }}
          RESULT: ${{ steps[format('acceptance_{0}', matrix.case)].outcome }}
        run: |
          printf 'Real-device fixture %s: %s\n' "$CASE" "${RESULT:-not-run}" >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = success
      - name: Upload functional evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tls-functional-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rust-tls-private-dns.log
            rust-tls-public-dns-*.log
            rust-tls-dns-replicas.log
            rust-tls-pool-cutover.log
            rust-tls-mesh-runtime.log
            rust-tls-multi-active-*.log
          if-no-files-found: warn
          retention-days: 14

  serial-performance:
    name: Isolated serial netns performance
    needs: openssl-rust-mtls
    if: ${{ !cancelled() && needs.openssl-rust-mtls.outputs.runtime_id != '' && ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/v111-handoff' || github.ref == 'refs/heads/feat/pq-wg-transport') || (github.ref == 'refs/heads/fix/v111-integration' || github.ref == 'refs/heads/test/v111-integrated-runtime') || github.ref == 'refs/heads/fix/v111-release-blockers' || (github.repository == 'Lanlan13-14/Boreas' && github.ref == 'refs/heads/test/v111-tcpv4-gso')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      delayed: ${{ steps.candidate_delayed.outcome }}
      gigabit: ${{ steps.candidate_gigabit.outcome }}
      gso: ${{ steps.acceptance_gso.outcome }}
    env:
      OPENSSL_CONF: ${{ github.workspace }}/.rust-tls-openssl/ssl/openssl.cnf
      BOREAS_OPENSSL_BIN: ${{ github.workspace }}/.rust-tls-openssl/bin/openssl
      BOREAS_REQUIRE_TLS_TESTS: '1'
      BOREAS_NETNS_WAN_TUNED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.openssl-rust-mtls.outputs.binary_id }}
          path: hop-node-linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.openssl-rust-mtls.outputs.runtime_id }}
          path: acceptance-runtime
      - name: Verify and prepare the exact build for namespace tests
        id: prepare
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (cd hop-node-linux && sha256sum --check --strict SHA256SUMS)
          grep -Fx "Source commit: $GITHUB_SHA" hop-node-linux/README-DEVELOPMENT.txt
          (cd acceptance-runtime && sha256sum --check --strict SHA256SUMS)
          test "$(cat acceptance-runtime/source-sha)" = "$GITHUB_SHA"
          tar -xf acceptance-runtime/runtime.tar
          test -x "$BOREAS_OPENSSL_BIN"
          test -s "$OPENSSL_CONF"
          chmod 0755 hop-node-linux/boreas-linux-x86_64-musl-pq768
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iputils-ping
          sudo modprobe tun || true
          # Built-in BBR works even if modprobe reports no module.
          sudo modprobe tcp_bbr || true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable snapshot
        id: perf_toolchain
      - name: Record performance runner and exact binary
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.perf_toolchain.outcome == 'success' && (github.ref == 'refs/heads/fix/v111-release-blockers' || (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/v111-integration' || github.ref == 'refs/heads/test/v111-integrated-runtime' || github.ref == 'refs/heads/work/v111-handoff')) }}
        run: |
          set -euo pipefail
          {
            printf 'source_sha=%s\nrunner_image=%s/%s\n' "$GITHUB_SHA" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -srmo
            LC_ALL=C lscpu
            rustc -vV
            ip -Version
            tc -Version
            sha256sum hop-node-linux/boreas-linux-x86_64-musl-pq768
          } > rust-tls-perf-environment.txt
      - name: Check three delayed full-duplex samples
        id: candidate_delayed
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.perf_toolchain.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/fix/v111-release-blockers' || (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/v111-integration' || github.ref == 'refs/heads/test/v111-integrated-runtime' || github.ref == 'refs/heads/work/v111-handoff')) }}
        timeout-minutes: 7
        env:
          BOREAS_NETEM_RTT_MS: '200'
          BOREAS_NETEM_LOSS_PERCENT: '0.1'
          BOREAS_NETEM_RATE_MBIT: 'unlimited'
          BOREAS_MAX_PING_MS: '415'
          BOREAS_MIN_THROUGHPUT_MBPS: '3'
          BOREAS_PERF_BYTES: '8388608'
          BOREAS_PERF_TIMEOUT_SECONDS: '25'
          BOREAS_NETNS_EDGE_LIFETIME_SECONDS: '50'
          BOREAS_DIAGNOSTIC_TIMING: '1'
        run: |
          set -euo pipefail
          failed=0
          for sample in 1 2 3; do
            if ! sudo -E timeout --kill-after=5s 95s bash tools/release/netns_daemon_smoke.sh \
              hop-node-linux/boreas-linux-x86_64-musl-pq768 \
              2>&1 | tee "rust-tls-netns-delayed-${sample}.log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Require gigabit useful goodput in each direction
        id: candidate_gigabit
        if: ${{ !cancelled() && (steps.candidate_delayed.outcome == 'success' || steps.candidate_delayed.outcome == 'failure') }}
        timeout-minutes: 4
        env:
          BOREAS_MIN_THROUGHPUT_MBPS: '1000'
          BOREAS_PERF_BYTES: '268435456'
          BOREAS_PERF_TIMEOUT_SECONDS: '25'
          BOREAS_NETNS_EDGE_LIFETIME_SECONDS: '33'
          # Measure the normal runtime. The separate diagnostic records per-packet timing.
          BOREAS_DIAGNOSTIC_TIMING: '0'
        run: |
          set -euo pipefail
          # The three samples are independent netns fixtures, so run them
          # concurrently instead of back to back. Each writes its own log.
          pids=""
          for sample in 1 2 3; do
            log="rust-tls-netns-gigabit-${sample}.log"
            (
              if sudo -E timeout --kill-after=5s 55s bash tools/release/netns_daemon_smoke.sh \
                hop-node-linux/boreas-linux-x86_64-musl-pq768 > "$log" 2>&1; then
                printf 'sample_exit=0\n' >> "$log"
              else
                sample_exit=$?
                printf 'sample_exit=%s\n' "$sample_exit" >> "$log"
                exit 1
              fi
            ) &
            pids="$pids $!"
          done
          failed=0
          for pid in $pids; do
            wait "$pid" || failed=1
          done
          for sample in 1 2 3; do
            echo "===== gigabit sample ${sample} ====="
            cat "rust-tls-netns-gigabit-${sample}.log"
          done
          exit "$failed"
      - name: Record one instrumented sample after a gigabit failure (diagnostic only)
        if: ${{ !cancelled() && steps.candidate_gigabit.outcome == 'failure' }}
        timeout-minutes: 2
        env:
          BOREAS_MIN_THROUGHPUT_MBPS: '1000'
          BOREAS_PERF_BYTES: '268435456'
          BOREAS_PERF_TIMEOUT_SECONDS: '25'
          BOREAS_NETNS_EDGE_LIFETIME_SECONDS: '33'
          BOREAS_DIAGNOSTIC_TIMING: '1'
        run: |
          set -euo pipefail
          log=rust-tls-netns-gigabit-diagnostic.log
          if sudo -E timeout --kill-after=5s 55s bash tools/release/netns_daemon_smoke.sh \
              hop-node-linux/boreas-linux-x86_64-musl-pq768 2>&1 | tee "$log"; then
            rc=0
          else
            rc=$?
          fi
          printf 'sample_scope=diagnostic-only\nsample_exit=%s\n' "$rc" | tee -a "$log"
      - name: Measure high-RTT first-second payload on one and four application streams
        # The same candidate and circuit are used for both rounds; this does
        # not establish multi-circuit operation or replace the goodput gates.
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.single_circuit_diagnostics && github.repository == 'Lanlan13-14/Boreas' && (steps.candidate_delayed.outcome == 'success' || steps.candidate_delayed.outcome == 'failure') }}
        timeout-minutes: 5
        env:
          BOREAS_NETNS_MULTISTREAM: '1'
          BOREAS_MULTISTREAM_BYTES: '8388608'
          BOREAS_NETEM_RTT_MS: '200'
          BOREAS_NETEM_LOSS_PERCENT: '0.1'
          BOREAS_NETEM_RATE_MBIT: 'unlimited'
          BOREAS_MAX_PING_MS: '415'
          BOREAS_NETNS_EDGE_LIFETIME_SECONDS: '100'
          BOREAS_PERF_TIMEOUT_SECONDS: '45'
          BOREAS_DIAGNOSTIC_TIMING: '0'
        run: |
          set -euo pipefail
          sudo -E timeout --kill-after=5s 135s bash tools/release/netns_daemon_smoke.sh \
            hop-node-linux/boreas-linux-x86_64-musl-pq768 \
            2>&1 | tee rust-tls-netns-multistream.log
      - name: Measure explicitly enabled TCPv4 GSO over real TUN and strict E2E
        id: acceptance_gso
        # This profile never replaces the earlier default-profile gates.
        if: ${{ !cancelled() && github.repository == 'Lanlan13-14/Boreas' && ((github.ref == 'refs/heads/test/v111-tcpv4-gso' && success()) || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/v111-handoff') && (steps.candidate_gigabit.outcome == 'success' || steps.candidate_gigabit.outcome == 'failure'))) }}
        timeout-minutes: 5
        env:
          BOREAS_NETNS_TCPV4_GSO: '1'
          BOREAS_MIN_THROUGHPUT_MBPS: '1000'
          BOREAS_PERF_BYTES: '268435456'
          BOREAS_PERF_TIMEOUT_SECONDS: '25'
          BOREAS_NETNS_EDGE_LIFETIME_SECONDS: '33'
          BOREAS_DIAGNOSTIC_TIMING: '0'
        run: |
          set -euo pipefail
          failed=0
          for sample in 1 2 3; do
            if ! sudo -E timeout --kill-after=5s 55s bash tools/release/netns_daemon_smoke.sh \
              hop-node-linux/boreas-linux-x86_64-musl-pq768 2>&1 | tee "rust-tls-gso-${sample}.log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tls-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rust-tls-netns-delayed-*.log
            rust-tls-netns-gigabit-*.log
            rust-tls-gso-*.log
            rust-tls-netns-multistream.log
            rust-tls-perf-environment.txt
          if-no-files-found: warn
          retention-days: 14

  mandatory-acceptance:
    name: Mandatory real-device acceptance
    needs: [functional-netns, serial-performance]
    if: ${{ !cancelled() && github.repository == 'Lanlan13-14/Boreas' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/v111-handoff') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every acceptance step to have actually passed
        env:
          FUNCTIONAL_RESULT: ${{ needs.functional-netns.result }}
          DELAYED_RESULT: ${{ needs.serial-performance.outputs.delayed }}
          GIGABIT_RESULT: ${{ needs.serial-performance.outputs.gigabit }}
          GSO_RESULT: ${{ needs.serial-performance.outputs.gso }}
          PERFORMANCE_RESULT: ${{ needs.serial-performance.result }}
        run: |
          set -euo pipefail
          failed=0
          {
            printf '\n### Mandatory real-device acceptance\n\n'
            for check in FUNCTIONAL DELAYED GIGABIT GSO PERFORMANCE; do
              var="${check}_RESULT"
              outcome="${!var}"
              printf -- '- %s: `%s`\n' "$check" "${outcome:-not-run}"
              if [[ "$outcome" != success ]]; then
                failed=1
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
