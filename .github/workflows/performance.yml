name: 'Integration / Network delay, loss and routing matrix'

on:
  workflow_run:
    workflows: ['Integration / Encrypted tunnel, failover and throughput']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful main-branch rust-tls run containing the tested binary'
        required: true
        type: string
      run_window_diagnostic:
        description: 'Compare short and long transfers using the same binary'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: perf-netem-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || inputs.source_run_id || github.sha }}
  cancel-in-progress: true

jobs:
  source:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Validate exact trusted backend artifact source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run: ${{ steps.source.outputs.run }}
    steps:
      - name: Resolve and validate backend run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        shell: python
        run: |
          import json, os, re, urllib.request
          repo, run_id = os.environ['REPOSITORY'], os.environ['RUN_ID']
          if not re.fullmatch(r'[1-9][0-9]{0,19}', run_id):
              raise SystemExit('Invalid source run id')
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          run = get('/actions/runs/' + run_id)
          workflow = get('/actions/workflows/' + str(run['workflow_id']))
          if not (run['repository']['full_name'] == repo
                  and run['head_repository']['full_name'] == repo
                  and run['head_branch'] == 'main'
                  and run['event'] in ('push', 'workflow_dispatch')
                  and run['status'] == 'completed' and run['conclusion'] == 'success'
                  and workflow['path'] == '.github/workflows/rust-tls.yml'
                  and re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])):
              raise SystemExit('Source must be a successful trusted main-branch backend run')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\nrun=' + run_id + '\n')
          print('Validated source_sha=' + run['head_sha'] + ' source_run=' + run_id)

  netem:
    # Manual and automatic execution use only the validated source run and SHA.
    needs: source
    name: one-way ${{ matrix.rtt }}ms / loss ${{ matrix.loss }}% / rate ${{ matrix.rate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rtt: 50
            loss: 0
            rate: unlimited
            max_ping: 115
            min_mbps: 3
            payload_bytes: 67108864
            edge_lifetime_seconds: 230
          - rtt: 200
            loss: 0.1
            rate: unlimited
            max_ping: 415
            min_mbps: 3
            payload_bytes: 67108864
            edge_lifetime_seconds: 230
          - rtt: 400
            loss: 1
            rate: unlimited
            max_ping: 815
            min_mbps: 1
            payload_bytes: 67108864
            edge_lifetime_seconds: 620
          - rtt: 200
            loss: 3
            rate: unlimited
            max_ping: 415
            min_mbps: 0.5
            payload_bytes: 16777216
            edge_lifetime_seconds: 330
    steps:
      - name: Record triggering source commit
        run: |
          set -euo pipefail
          test -n '${{ needs.source.outputs.sha }}'
          echo 'source_sha=${{ needs.source.outputs.sha }}' >> "$GITHUB_ENV"
          echo 'source_run=${{ needs.source.outputs.run }}' >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: boreas-hop-node-linux-x86_64-${{ needs.source.outputs.run }}
          run-id: ${{ needs.source.outputs.run }}
          github-token: ${{ github.token }}
          path: artifact
      - name: Install network-namespace tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iputils-ping
          sudo modprobe tcp_bbr || true
          test -s artifact/boreas-linux-x86_64-musl-pq768
          (cd artifact && sha256sum --check --strict SHA256SUMS)
          chmod 0755 artifact/boreas-linux-x86_64-musl-pq768
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run isolated impaired-path full-duplex test
        env:
          BOREAS_NETNS_WAN_TUNED: '1'
          BOREAS_NETEM_RTT_MS: ${{ matrix.rtt }}
          BOREAS_NETEM_LOSS_PERCENT: ${{ matrix.loss }}
          BOREAS_NETEM_RATE_MBIT: ${{ matrix.rate }}
          BOREAS_MAX_PING_MS: ${{ matrix.max_ping }}
          BOREAS_MIN_THROUGHPUT_MBPS: ${{ matrix.min_mbps }}
          # Match fixture lifetime to payload at the unchanged goodput floor.
          # The 0.5 Mbit/s profile uses 16 MiB to stay within the job budget.
          # These are completion measurements, not steady-state throughput.
          BOREAS_PERF_BYTES: ${{ matrix.payload_bytes }}
          BOREAS_NETNS_EDGE_LIFETIME_SECONDS: ${{ matrix.edge_lifetime_seconds }}
        run: |
          set -euo pipefail
          {
            printf 'source_sha=%s\nsource_run=%s\n' "$source_sha" "$source_run"
            printf 'probe_bytes_per_direction=%s\nthroughput_floor_mbps_per_direction=%s\n' \
              "$BOREAS_PERF_BYTES" "$BOREAS_MIN_THROUGHPUT_MBPS"
            # Preserve the existing security and probe I/O deadlines. This
            # separate outer guard bounds fixture setup, transfer and cleanup.
            guard_seconds=$((BOREAS_NETNS_EDGE_LIFETIME_SECONDS + 90))
            sudo -E timeout --kill-after=5s "${guard_seconds}s" bash tools/release/netns_daemon_smoke.sh \
              "$PWD/artifact/boreas-linux-x86_64-musl-pq768"
          } 2>&1 | tee "netem-${source_sha}.log"
      - name: Upload exact-commit performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netem-${{ needs.source.outputs.run }}-${{ matrix.rtt }}ms-${{ matrix.loss }}pct-rate-${{ matrix.rate }}
          path: netem-*.log
          if-no-files-found: warn
          retention-days: 14

  routing:
    needs: source
    name: Policy and asymmetric routing / MTU 1280 and 1500
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: boreas-hop-node-linux-x86_64-${{ needs.source.outputs.run }}
          run-id: ${{ needs.source.outputs.run }}
          github-token: ${{ github.token }}
          path: artifact
      - name: Validate artifact and install namespace tools
        run: |
          set -euo pipefail
          (cd artifact && sha256sum --check --strict SHA256SUMS)
          chmod 0755 artifact/boreas-linux-x86_64-musl-pq768
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iputils-ping binutils
          sudo modprobe tun || true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exercise actual pq768 daemon with protected management routes
        run: |
          set -euo pipefail
          sudo -E bash tools/release/netns_routing_matrix.sh \
            "$PWD/artifact/boreas-linux-x86_64-musl-pq768" "$PWD/routing-matrix-artifacts"
      - name: Upload exact-commit routing snapshots and traffic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: routing-matrix-${{ needs.source.outputs.run }}
          path: routing-matrix-artifacts/
          if-no-files-found: warn
          retention-days: 14

  window-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.run_window_diagnostic
    # Independent read-only diagnostic: same validated source binary, same
    # one-way 200 ms / 0.1% loss / unshaped profile as the strict netem gate,
    # with an 8 MiB probe and a 64 MiB probe. Both samples run even if the
    # first fails; the job fails if either sample fails. The short probe is
    # dominated by slow start; the long one is the sustained rate. Neither is
    # an SLA.
    #
    # The smoke also emits a bounded periodic underlay trajectory (ss -tin
    # TCP_INFO plus tc qdisc and TUN counters) from before the daemons start.
    # That evidence is diagnostic only: it changes no threshold, wait, netem
    # profile or byte count, and nothing in it can mark a sample as accepted.
    needs: source
    name: Diagnostic 8 MiB vs 64 MiB (one-way 200 ms, loss 0.1%, unshaped)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      # Controlled opt-in for this diagnostic job only: the smoke then echoes the
      # binary's fixed-format handshake stage lines to stdout. The strict netem
      # and routing gates below never set it, and no threshold changes.
      BOREAS_DIAGNOSTIC_TIMING: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: boreas-hop-node-linux-x86_64-${{ needs.source.outputs.run }}
          run-id: ${{ needs.source.outputs.run }}
          github-token: ${{ github.token }}
          path: artifact
      - name: Validate the single validated-source binary
        run: |
          set -euo pipefail
          sudo modprobe tcp_bbr || true
          test -s artifact/boreas-linux-x86_64-musl-pq768
          (cd artifact && sha256sum --check --strict SHA256SUMS)
          chmod 0755 artifact/boreas-linux-x86_64-musl-pq768
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 iputils-ping
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Measure 8 MiB then 64 MiB without masking either result
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          SOURCE_RUN: ${{ needs.source.outputs.run }}
          BOREAS_NETNS_WAN_TUNED: '1'
          BOREAS_NETEM_RTT_MS: '200'
          BOREAS_NETEM_LOSS_PERCENT: '0.1'
          BOREAS_NETEM_RATE_MBIT: 'unlimited'
          # Same regression bounds as the strict 200 ms / 0.1% / unshaped gate.
          BOREAS_MAX_PING_MS: '415'
          BOREAS_MIN_THROUGHPUT_MBPS: '3'
        run: |
          set +e
          set -u
          set -o pipefail
          {
            echo "diagnostic_source_sha=${SOURCE_SHA}"
            echo "diagnostic_source_run=${SOURCE_RUN}"
            echo 'diagnostic_profile=one-way-200ms-loss-0.1pct-unshaped'
            echo 'diagnostic_scope=single-paired-short-window-not-steady-state'
            echo 'diagnostic_telemetry=namespace-periodic-ss-tin+tc-qdisc+ip-link-diag-only'
          } > diagnostic-status.txt
          overall=0
          run_sample() {
            local label="$1"
            local bytes="$2"
            local lifetime="$3"
            local log="diagnostic-${label}.log"
            local rc
            local -a pipe_status
            echo "=== ${label}: ${bytes} bytes, Edge lifetime ${lifetime} s ==="
            BOREAS_PERF_BYTES="$bytes" BOREAS_NETNS_EDGE_LIFETIME_SECONDS="$lifetime" \
              sudo -E bash tools/release/netns_daemon_smoke.sh \
              "$PWD/artifact/boreas-linux-x86_64-musl-pq768" 2>&1 | tee "$log"
            pipe_status=("${PIPESTATUS[@]}")
            rc="${pipe_status[0]}"
            if (( pipe_status[1] != 0 )); then
              echo "ERROR: tee failed to write ${log}" >&2
              rc=1
            fi
            {
              echo "diagnostic_sample_${label}_bytes=${bytes}"
              echo "diagnostic_sample_${label}_smoke_exit=${rc}"
              if (( rc != 0 )); then
                echo "diagnostic_sample_${label}_result=failed"
              else
                echo "diagnostic_sample_${label}_result=smoke-passed"
              fi
            } >> diagnostic-status.txt
            if (( rc != 0 )); then
              overall=1
            fi
          }
          run_sample short_8mib 8388608 50
          run_sample sustained_64mib 67108864 230
          cat diagnostic-status.txt
          exit "$overall"
      - name: Report raw evidence and failure reasons
        if: always()
        run: |
          set +e
          set -u
          echo 'diagnostic_caveat=single short window, not steady state and not an SLA'
          echo 'diagnostic_telemetry_caveat=periodic underlay ss/tc/TUN counters are diagnostic; no threshold and never acceptance'
          if [[ -f diagnostic-status.txt ]]; then
            cat diagnostic-status.txt
          else
            echo 'diagnostic_status=unavailable'
          fi
          for label in short_8mib sustained_64mib; do
            log="diagnostic-${label}.log"
            echo "--- ${label} raw throughput / CPU / RSS ---"
            if [[ ! -f "$log" ]]; then
              echo "${label}_evidence=missing"
              continue
            fi
            grep -E '^(overlay_throughput_(edge_to_core|core_to_edge)_mbps|overlay_ping_(loss_percent|average_ms|max_ms)|resource_(evidence_status|window_seconds|samples)|(core|edge)_(evidence_status|window_seconds|samples|cpu_[a-z_]+|rss_peak_kb)|underlay_telemetry_[a-z_]+)=' "$log" || true
            reasons="$(grep -E '(^ERROR:|^  - |overlay_perf_failure:|overlay_ping_failure:|resource_evidence_detail=|^Traceback)' "$log" | tail -n 40)"
            echo "--- ${label} failure reasons ---"
            if [[ -n "$reasons" ]]; then
              printf '%s\n' "$reasons"
            else
              echo "${label}_failure_reasons=none-in-log"
            fi
          done
      - name: Upload diagnostic logs and raw evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: window-diagnostic-${{ needs.source.outputs.run }}
          path: |
            diagnostic-*.log
            diagnostic-status.txt
          if-no-files-found: warn
          retention-days: 14
