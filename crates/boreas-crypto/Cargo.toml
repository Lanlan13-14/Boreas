[package]
name = "boreas-crypto"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[features]
default = []
openssl-backend = ["dep:openssl", "dep:openssl-sys", "dep:foreign-types-shared"]

[dependencies]
# Pinned to the maintained upstream rust-openssl release reviewed in docs/research.
# This opts into actual OpenSSL via feature only; the default workspace build stays backend-free.
openssl = { version = "=0.10.82", optional = true }
openssl-sys = { version = "=0.9.118", optional = true }
# Importing ForeignTypeRef is required to pass SslRef's borrowed pointer to
# openssl-sys introspection functions without owning/freeing the SSL object.
# This exact version is the instance openssl 0.10.82 links through foreign-types
# 0.3.2 (^0.1). 0.3.1 was reviewed and is blocked, not pending: a direct bump
# would add a second copy of the crate, so SslRef would no longer implement the
# trait imported here. See tools/dependencies/crates-review.json.
foreign-types-shared = { version = "=0.1.1", optional = true }
