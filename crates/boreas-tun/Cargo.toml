[package]
name = "boreas-tun"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.100"
description = "Bounded L3 packet IO primitives for Boreas"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "windows")'.dependencies]
# 0.61.2 is audited (rust-version 1.71, identical feature names, windows-link
# instead of the windows-targets fan-out) but deliberately not applied here: the
# upgrade rewrites Cargo.lock, which the Actions lock job owns, and no Windows
# compile evidence exists yet. See tools/dependencies/crates-review.json.
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[lib]
path = "src/lib.rs"
