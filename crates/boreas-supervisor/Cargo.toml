[package]
name = "boreas-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
description = "Crash-recoverable Boreas upgrade journal/active-pointer primitives and the external supervisor process entrypoint"

[lib]
path = "src/lib.rs"

[[bin]]
name = "boreas-supervisor"
path = "src/main.rs"

[features]
default = []
# Real Ed25519 + ML-DSA-65 release verification and artifact SHA-256, backed by
# the maintained `openssl` crate (same provider and pin as boreas-pki /
# boreas-crypto). ML-DSA key types require OpenSSL 3.5+; on older system
# libraries key parsing fails and verification reports an error. The default
# build compiles no crypto code and `manifest::verify_release` fails closed with
# `ManifestError::VerificationUnavailable`.
openssl-backend = ["dep:openssl"]

[dependencies]
# Optional: only pulled in by the `openssl-backend` feature. Never enabled by the
# default workspace build, which keeps the musl static artifacts crypto-free.
openssl = { version = "=0.10.82", optional = true }

# Linux: classic seccomp-BPF install in `sandbox` (`PR_SET_NO_NEW_PRIVS` then
# `seccomp(SECCOMP_SET_MODE_FILTER, TSYNC)`). macOS: the store's `F_FULLFSYNC`
# and directory-fsync backend. Both use the same pinned `libc` the rest of the
# workspace already locks (`boreas-tun`), so no new package enters
# `Cargo.lock`. Windows needs `windows-sys`, which is *not* locked, so its
# adapter stays unwired and the store keeps failing closed there.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.191"
