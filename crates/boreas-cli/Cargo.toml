[package]
name = "boreas-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
description = "Boreas CLI foundation plus optional hop-node process behind openssl-inner-tls"

[[bin]]
name = "boreas"
path = "src/main.rs"

[features]
default = []
# Links the reviewed OpenSSL pq768 hop path. The default five-target package
# does not enable this: it has no TLS backend and `node` refuses to start.
openssl-inner-tls = [
    "dep:boreas-crypto",
    "dep:boreas-proto",
    "dep:boreas-supervisor",
    "dep:boreas-tun",
    "dep:boreas-tunnel",
    "boreas-crypto/openssl-backend",
    "boreas-pki/openssl-backend",
    "boreas-tunnel/openssl-inner-tls",
    "dep:openssl",
]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.2.1+spec-1.1.0"
boreas-crypto = { path = "../boreas-crypto", optional = true }
boreas-pki = { path = "../boreas-pki" }
boreas-proto = { path = "../boreas-proto", optional = true }
boreas-tun = { path = "../boreas-tun", optional = true }
boreas-tunnel = { path = "../boreas-tunnel", optional = true }
# This optional normal dependency also serves real backend test fixtures.
# Dev-dependencies cannot be optional; the feature is the only activation point.
openssl = { version = "=0.10.82", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
boreas-supervisor = { path = "../boreas-supervisor", optional = true }

# Unix-only: O_NOFOLLOW/O_NONBLOCK/O_CLOEXEC for the safe config open and
# geteuid for the owner check. Already present in Cargo.lock via other crates,
# so this adds no new locked package.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
