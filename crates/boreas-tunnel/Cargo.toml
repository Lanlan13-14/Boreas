[package]
name = "boreas-tunnel"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.100"
description = "Boreas hop-transport runtime (direct TCP and WSS h1, WireGuard-style TLS-less PQ hop and E2E channels, session authorization, E2E circuit seam) plus pure routing-policy primitives"

[lib]
path = "src/lib.rs"

[features]
default = []
# Counters only; no alternate authentication or data path. Off in published builds.
record-diagnostics = []
# Links the reviewed OpenSSL pq768 inner-TLS backend from `boreas-crypto`, plus
# the in-tree outer HTTPS(WSS) adapter, the `boreas-pki` verified-object
# identity extractor, and the diagnostic inner-TLS seam helpers. The default
# build keeps policy types but no TLS backend and cannot negotiate a TLS session.
openssl-inner-tls = ["boreas-crypto/openssl-backend", "boreas-pki/openssl-backend", "dep:openssl", "dep:boreas-pki", "dep:boreas-dns", "boreas-dns/secure-upstream"]

[dependencies]
# Runtime authorization uses these policy types even without a TLS backend.
boreas-crypto = { path = "../boreas-crypto" }
# Bounded authoritative DNS wire handling for the UDP service that answers the
# signed zone on the reserved DNS VIP. No socket/TCP runtime of its own.
boreas-dns = { path = "../boreas-dns", optional = true }
boreas-pki = { path = "../boreas-pki", optional = true }
boreas-proto = { path = "../boreas-proto" }
# Real bounded L3 packet I/O and `inspect_packet` validation for the E2E packet
# stream adapter. The default build has no TLS backend, so the adapter compiles
# but cannot reach an E2E circuit without `openssl-inner-tls`.
boreas-tun = { path = "../boreas-tun" }
# Same reviewed release as `boreas-crypto`'s backend; used by the outer TLS
# adapter and the certificate SPKI binding.
openssl = { version = "=0.10.82", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"
