[package]
name = "boreas-tunnel"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97"
description = "Pure routing policy and deterministic route arbitration primitives"

[lib]
path = "src/lib.rs"

[features]
default = []
# Links the reviewed strict pq768 inner TLS. Default builds stay backend-free.
openssl-inner-tls = ["dep:boreas-crypto", "boreas-crypto/openssl-backend"]

[dependencies]
boreas-crypto = { path = "../boreas-crypto", optional = true }
