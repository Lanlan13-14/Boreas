[workspace]
resolver = "3"
members = [
    "crates/boreas-cli",
    "crates/boreas-proto",
    "crates/boreas-pki",
    "crates/boreas-crypto",
    "crates/boreas-tunnel",
    "crates/boreas-tun",
    "crates/boreas-dns",
    "crates/boreas-supervisor",
]

# Each crate manifest is self-contained: package fields (edition, rust-version,
# license) are declared per crate, not inherited block-wide.
