[workspace]
resolver = "3"
members = [
    "crates/boreas-cli",
    "crates/boreas-proto",
    "crates/boreas-pki",
    "crates/boreas-crypto",
    "crates/boreas-tunnel",
    "crates/boreas-tun",
    "crates/boreas-dns",
    "crates/boreas-supervisor",
]

# Each crate manifest is self-contained: package fields (edition, rust-version,
# license) are declared per crate, not inherited block-wide.

[profile.release]
# Allow inlining across the packet, framing and transport crate boundaries.
# Keep portable target features and all existing security policy; validate
# actual throughput and build cost on Actions rather than assuming a gain.
lto = "thin"
